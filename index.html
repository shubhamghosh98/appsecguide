## 4. HSBC Specific Questions (Deep Model Answers)

<details>
<summary><b>1. What is second order SQL injection and second order NoSQL injection?</b></summary>

**Model Answer:**
"First-order SQL injection occurs when malicious input is executed immediately in a query. Second-order SQL injection is a delayed attack. The application takes malicious input and securely stores it in the database (e.g., via a parameterized query during registration). The vulnerability triggers later when the application retrieves that stored, tainted data and uses it unsafely in a different query, such as string concatenation.
Second-order NoSQL injection follows the same concept but targets NoSQL databases like MongoDB. An attacker might input a malicious JSON payload or MongoDB operator like `$gt` (greater than) into a profile field. This is stored safely. Later, an admin views the profile, and the application uses that stored payload in a backend `db.collection.find()` operation without sanitization, leading to unauthorized data access."
</details>

<details>
<summary><b>2. Difference between SSRF and RFI?</b></summary>

**Model Answer:**
"Both involve making the server fetch resources, but their mechanics and impact differ.
**SSRF (Server-Side Request Forgery)** occurs when an attacker forces the server to make an HTTP request to an arbitrary domain of the attacker's choosing. The vulnerability is in the application's URL fetching logic. The main goal is often to access internal, non-routable networks (like localhost or cloud metadata services like `169.254.169.254`), bypassing firewalls.
**RFI (Remote File Inclusion)** is specific to languages like PHP. It occurs when user input is passed directly to an `include()` or `require()` function. The server fetches an external file (e.g., `http://attacker.com/malicious.php`) and, crucially, **executes** its contents within the server's environment. The main goal of RFI is direct Remote Code Execution (RCE)."
</details>

<details>
<summary><b>3. What is prototype pollution?</b></summary>

**Model Answer:**
"Prototype Pollution is a vulnerability specific to JavaScript. In JS, objects inherit properties from a prototype object. If an application uses an insecure merge or clone function, an attacker can inject properties into the base `Object.prototype`. They do this by sending a JSON payload containing the `__proto__` or `constructor.prototype` keys. Because every object in JavaScript inherits from `Object.prototype`, this injected property pollutes the global scope. This can lead to logic bypasses (e.g., injecting an `isAdmin: true` property that the application checks later), Denial of Service, or in some specific gadget chains, Remote Code Execution."
</details>

<details>
<summary><b>4. What is SSTI and CSTI?</b></summary>

**Model Answer:**
"Both are template injection vulnerabilities, but they execute in different environments.
**SSTI (Server-Side Template Injection)** occurs when user input is unsafely embedded into a template engine (like Jinja2, Twig, or FreeMarker) on the server. The template engine evaluates the input as code. Because this executes on the backend, SSTI often leads to severe impact, primarily Remote Code Execution (RCE) on the server.
**CSTI (Client-Side Template Injection)** occurs when modern frontend frameworks (like Vue.js or AngularJS) dynamically render user input as a template expression within the user's browser. While the syntax might look similar to SSTI, the code executes client-side. Therefore, the impact of CSTI is typically equivalent to Cross-Site Scripting (XSS), allowing the attacker to steal cookies or perform actions on behalf of the user."
</details>

<details>
<summary><b>5. Different types of attacks in JWT?</b></summary>

**Model Answer:**
"JSON Web Tokens (JWT) are common in modern APIs, and attacks usually target the verification process.
1. **'None' Algorithm Attack:** The attacker changes the `alg` header to `none` and removes the signature. If the backend library is misconfigured, it might accept the token without verifying it.
2. **Algorithm Confusion:** The backend expects RS256 (asymmetric, uses a public/private key), but the attacker changes the header to HS256 (symmetric) and signs the token using the server's public key (which they extracted). If the server uses that public key as an HMAC secret, it validates the forged token.
3. **Secret Brute Forcing:** If HS256 is used with a weak, predictable secret, an attacker can brute-force the secret offline and then forge tokens.
4. **Kid (Key ID) vulnerabilities:** The `kid` header tells the server which key to use for verification. Attackers might exploit this via SQL injection in the database lookup, or Directory Traversal to force the server to use a known file as the key."
</details>

<details>
<summary><b>6. What is JWK and JOSE in JWT? Have you heard about PS encryption in JWT?</b></summary>

**Model Answer:**
"**JOSE (JSON Object Signing and Encryption)** is the overarching framework that defines how to securely represent claims. JWT (JSON Web Token), JWS (Signature), and JWE (Encryption) are all built on the JOSE framework.
**JWK (JSON Web Key)** is a JSON data structure that represents a cryptographic key. It's often used at an endpoint (like `/.well-known/jwks.json`) to distribute public keys so consumers can verify the signatures of JWTs issued by an authorization server.
Regarding **PS encryption**, I believe you are referring to the **PS256/PS384/PS512** algorithms. These are not encryption, but rather signing algorithms. They stand for RSASSA-PSS (Probabilistic Signature Scheme). Compared to the older RS256 (PKCS#1 v1.5), PSS is a more modern, mathematically secure padding scheme for RSA signatures. It introduces randomness into the signature process, making it highly resistant to certain theoretical attacks that affect older RSA padding."
</details>

<details>
<summary><b>7. What is mass assignment?</b></summary>

**Model Answer:**
"Mass assignment occurs when modern web frameworks automatically bind HTTP request parameters (like JSON payloads or form data) directly to internal object models or database fields without proper whitelisting. For example, a user submits a registration form with `username` and `password`. The developer binds the entire incoming JSON object to the `User` model. If the attacker intercepts the request and adds `"role": "admin"` to the JSON payload, the framework might automatically update the database record to make the user an admin, bypassing intended business logic."
</details>

<details>
<summary><b>8. File upload vulnerabilities — test cases and exploit when .txt extension is appended.</b></summary>

**Model Answer:**
"When testing file uploads, my test cases include: checking for unrestricted file types, bypassing extension blacklists (e.g., using `.php5` or `.phtml`), testing for path traversal in the filename (`../../../shell.php`), uploading massive files for DoS, and checking if uploaded files overwrite existing system files.
If an application forcefully appends `.txt` to uploads (e.g., `shell.php` becomes `shell.php.txt`), exploiting it for RCE is harder but possible depending on the server configuration.
1. **Null Byte Injection:** In older systems, uploading `shell.php%00.jpg` might cause the system to drop the `.txt` and process it as PHP.
2. **Server Misconfiguration (Apache):** If Apache is configured to execute files based on multiple extensions (e.g., `AddHandler application/x-httpd-php .php`), a file named `shell.php.txt` might still be parsed as PHP if the server processes the first known extension it sees.
3. **If RCE fails:** I would pivot to Client-Side attacks. I can upload an HTML file containing XSS payload as `xss.html.txt`. When another user clicks the link to view the text file, the browser might sniff the MIME type as HTML and execute the JavaScript."
</details>

<details>
<summary><b>9. Which layer nmap works in?</b></summary>

**Model Answer:**
"Nmap operates across multiple layers of the OSI model depending on the scan type. The default TCP SYN scan (`-sS`), TCP Connect scan (`-sT`), and UDP scan (`-sU`) operate at the **Transport Layer (Layer 4)**. However, if you run OS detection (`-O`) or use NSE scripts that send malformed packets, it operates at the **Network Layer (Layer 3)**. Finally, when using service version detection (`-sV`) or application-specific NSE scripts (like HTTP enumeration), it interacts with the **Application Layer (Layer 7)**."
</details>

<details>
<summary><b>10. Which port ICMP uses?</b></summary>

**Model Answer:**
"This is a trick question. ICMP (Internet Control Message Protocol) **does not use ports**. Ports are a concept of the Transport Layer (Layer 4) used by protocols like TCP and UDP. ICMP is a Network Layer (Layer 3) protocol, operating alongside IP. Instead of ports, ICMP uses 'Types' and 'Codes' to identify messages. For example, an Echo Request (Ping) is Type 8, Code 0, and an Echo Reply is Type 0, Code 0."
</details>

<details>
<summary><b>11. Nmap is written in which language?</b></summary>

**Model Answer:**
"The core engine of Nmap, responsible for high-performance packet crafting and raw socket operations, is written in **C and C++**. However, the Nmap Scripting Engine (NSE), which powers advanced vulnerability detection and automation, uses scripts written in **Lua**."
</details>

<details>
<summary><b>12. In XSS if CSP is implemented how to bypass it?</b></summary>

**Model Answer:**
"Bypassing Content Security Policy (CSP) depends entirely on how poorly the policy is configured.
1. **`unsafe-inline` or `unsafe-eval`:** If the policy allows these, standard XSS payloads will work directly.
2. **Open Redirects/JSONP:** If the CSP whitelists a domain (e.g., `script-src 'self' api.google.com`), I would look for an open redirect or a JSONP endpoint on `api.google.com`. I can inject a script tag pointing to that trusted domain, but manipulate the JSONP callback to execute my payload, bypassing the policy.
3. **File Uploads:** If the site allows file uploads and whitelists its own domain (`'self'`), I can upload a malicious JS file and then reference it in my XSS payload (`&lt;script src="/uploads/my_malicious.js"&gt;&lt;/script&gt;`).
4. **Angular/Vue Misconfigurations:** If an older AngularJS library is whitelisted, I can exploit Client-Side Template Injection, which often bypasses standard CSP script restrictions."
</details>

<details>
<summary><b>13. Ways to mitigate CSRF attacks?</b></summary>

**Model Answer:**
"There are three primary ways to mitigate Cross-Site Request Forgery (CSRF).
1. **Anti-CSRF Tokens (Synchronizer Token Pattern):** The server generates a unique, cryptographically strong, and unpredictable token per session (or per request). This token is embedded in forms (as a hidden field) or sent via custom HTTP headers. The server rejects any state-changing request that doesn't include the valid token.
2. **SameSite Cookie Attribute:** Setting the session cookie with `SameSite=Lax` or `SameSite=Strict`. This instructs the browser not to send the session cookie in cross-site requests (like a POST request originating from an attacker's domain). This is the most modern and effective defense-in-depth measure.
3. **Double Submit Cookie:** The server sends a random value in a cookie and requires the client to send that exact same value in a request parameter. The server verifies they match. This works because an attacker cannot read or modify cookies due to the Same Origin Policy, so they cannot know the value to submit in the parameter."
</details>

## 💡 Final Interview Advice
- **Don't just know the payload; know the root cause.** Interviewers care more about *why* `<script>alert(1)</script>` works (lack of contextual output encoding) than the payload itself.
- **Always discuss mitigation.** When asked about a vulnerability, finish your explanation by telling them exactly how to fix it in code.
- **Understand the business impact.** SSRF isn't just "fetching an internal IP," it's potentially "stealing AWS metadata credentials leading to a total cloud compromise."

# Section 10: Advanced Topics & Cloud Security (Weeks 17-18)

Welcome to the final frontier. This section covers the advanced, modern attacks that separate entry-level analysts from top-tier AppSec Engineers at product companies like Razorpay, CRED, Flipkart, and global MNCs. 

---

## 1. Cloud Security Basics for AppSec (AWS Focus)

Modern applications are hosted in the cloud. As an AppSec engineer, you must understand how web vulnerabilities escalate into full cloud compromise. While we focus heavily on AWS (as it's dominant in the Indian startup ecosystem), the concepts apply to GCP and Azure as well.

### 🎯 SSRF to Cloud Metadata Compromise
**What it is:** When an application is vulnerable to Server-Side Request Forgery (SSRF), an attacker can force the server to make requests to internal IP addresses. In a cloud environment, the most dangerous IP is the **Instance Metadata Service (IMDS)** at `169.254.169.254`.

- **AWS Context:** By hitting `http://169.254.169.254/latest/meta-data/iam/security-credentials/role-name`, the attacker can steal temporary AWS access keys associated with the EC2 instance.
- **GCP/Azure Context:** Similar services exist (e.g., GCP requires a `Metadata-Flavor: Google` header, making basic SSRF harder to exploit).

**Mitigation (AWS IMDSv2):** 
AWS introduced IMDSv2, which requires the client to first fetch a session token via a `PUT` request with a specific header (`X-aws-ec2-metadata-token-ttl-seconds`). Since standard SSRF usually only controls `GET` requests and cannot inject custom headers, IMDSv2 effectively kills this attack vector.

### 🪣 S3 Bucket Misconfigurations
**What it is:** Amazon S3 (Simple Storage Service) buckets are often misconfigured to allow public read or write access.
- **Public Read:** Leads to massive data leaks (PII, source code, backups).
- **Public Write:** Attackers can overwrite files. If the bucket hosts JavaScript files for a website, an attacker can overwrite them to achieve **Stored XSS** across the entire application (Supply Chain Attack).
- **Subdomain Takeover (Dangling DNS):** If a company points `assets.shop.com` to an S3 bucket (`shop-assets-123.s3.amazonaws.com`), but later deletes the bucket without removing the DNS record, an attacker can create a bucket with the exact same name and take over the subdomain.

### 🔑 IAM Privilege Escalation
**What it is:** Identity and Access Management (IAM) defines who can do what. If an application (or stolen token) has overly permissive policies (e.g., `iam:PutUserPolicy`), an attacker can grant themselves Admin access.

<details>
<summary><b>🎤 Interview Q: How would you prevent SSRF from escalating to a cloud compromise?</b></summary>
<b>Answer:</b> 
1. Enforce IMDSv2 across all AWS instances, which blocks simple GET-based SSRF by requiring a PUT token. 
2. Apply the Principle of Least Privilege to the EC2 IAM role so even if keys are stolen, they cannot access sensitive data like S3 or databases.
3. Use a strict egress firewall or proxy to prevent the server from connecting to `169.254.169.254`.
</details>

## 2. Business Logic & Fintech Vulnerabilities

For companies handling money, business logic flaws are often more critical than technical injection flaws.

### 🏎️ Race Conditions (TOCTOU - Time of Check to Time of Use)
**What it is:** A concurrency flaw where multiple requests hit the server at the exact same millisecond. The server checks a condition (e.g., "does the user have enough balance?") for all requests simultaneously *before* it updates the database for any of them.

**Code-Level Example (Node.js/Python logic):**
Imagine a user with ₹100 balance attempting to transfer ₹100. They use Burp Suite to send 5 requests at the exact same time.

```javascript
// ❌ VULNERABLE CODE (No locking)
async function transferMoney(userId, amount) {
    // Check: Database reads balance
    const account = await db.query('SELECT balance FROM accounts WHERE id = ?', [userId]);
    
    if (account.balance >= amount) {
        // Attackers send 5 requests simultaneously.
        // ALL 5 requests hit this IF condition before the UPDATE happens!
        
        // Use: Database updates balance
        const newBalance = account.balance - amount;
        await db.query('UPDATE accounts SET balance = ? WHERE id = ?', [newBalance, userId]);
        return "Transfer successful";
    }
    return "Insufficient funds";
}
```

**Result:** The attacker transfers ₹500 even though they only had ₹100.

**Mitigation (Database Locking):**
Use Pessimistic Locking (e.g., `SELECT ... FOR UPDATE` in SQL) or Optimistic Locking (version columns).

```javascript
// ✅ SECURE CODE (Pessimistic Locking)
async function transferMoney(userId, amount) {
    // BEGIN TRANSACTION
    // SELECT ... FOR UPDATE locks the row. Other concurrent requests must wait in a queue.
    const account = await db.query('SELECT balance FROM accounts WHERE id = ? FOR UPDATE', [userId]);
    
    if (account.balance >= amount) {
        const newBalance = account.balance - amount;
        await db.query('UPDATE accounts SET balance = ? WHERE id = ?', [newBalance, userId]);
        // COMMIT TRANSACTION (Row is unlocked)
        return "Transfer successful";
    }
    return "Insufficient funds";
}
```

### 💸 Parameter Tampering & Price Manipulation
**What it is:** Attackers modify hidden fields or intercept traffic to change the price of an item or the quantity before checkout.
- **Exploit:** Changing `price=100` to `price=1` in the POST request.
- **Negative Values:** Sending `quantity=-1` to force the system to *refund* money instead of charging it.
- **Mitigation:** Never trust the client for pricing. The server must recalculate the total cost based on the internal product database using the `product_id`.

## 3. Threat Modeling (The STRIDE Framework)

Threat modeling is the process of identifying vulnerabilities during the **design phase**, before any code is written. 

### 🛡️ The STRIDE Methodology
Developed by Microsoft, STRIDE helps categorize threats:
- **S**poofing (Impersonating something or someone) → Mitigate with AuthN.
- **T**ampering (Modifying data in transit or at rest) → Mitigate with TLS, Hashing.
- **R**epudiation (Claiming you didn't do something) → Mitigate with Logging/Auditing.
- **I**nformation Disclosure (Data leaks) → Mitigate with Encryption.
- **D**enial of Service (Crashing the system) → Mitigate with Rate Limiting.
- **E**levation of Privilege (Gaining admin rights) → Mitigate with AuthZ/RBAC.

### 🎤 Whiteboard Interview Scenario 1: Standard User Login Page
*Interviewer: "Draw a standard login page architecture and threat model it."*

1. **Spoofing:** Attacker uses credential stuffing. (Mitigation: MFA, Account Lockouts).
2. **Tampering:** Attacker modifies the JWT in transit. (Mitigation: HTTPS, Strong JWT Signatures).
3. **Repudiation:** User denies logging in from a foreign country. (Mitigation: Store IP/User-Agent logs securely).
4. **Information Disclosure:** Server responds with "Username does not exist" revealing valid accounts. (Mitigation: Generic error messages).
5. **Denial of Service:** Attacker brute-forces 100k requests to exhaust database connections. (Mitigation: Rate limiting, CAPTCHA).

### 🎤 Whiteboard Interview Scenario 2: Fintech Payment Gateway
*Interviewer: "Threat model the transaction flow of a payment gateway like Razorpay."*

1. **Spoofing:** A malicious merchant spoofs a callback to the main app saying "Payment Successful". (Mitigation: Webhook signatures/HMAC validation).
2. **Tampering:** User intercepts the `amount=500` parameter and changes it to `amount=1`. (Mitigation: Verify amounts server-side against the original cart ID).
3. **Information Disclosure:** Payment API logs full credit card numbers in CloudWatch. (Mitigation: Data masking, Tokenization/PCI-DSS compliance).
4. **Elevation of Privilege (Business Logic):** Race condition allowing double-withdrawal. (Mitigation: Database `FOR UPDATE` locks).

## 4. Advanced Authentication (SAML & SSO)

While OAuth/OIDC are common for consumer apps (B2C), enterprise applications (B2B) rely heavily on SAML.

### 📑 SAML (Security Assertion Markup Language)
**What it is:** An XML-based standard for exchanging authentication data between an Identity Provider (IdP) like Okta/Azure AD, and a Service Provider (SP) like your web app.
- **The Attack (XML Signature Wrapping - XSW):** SAML assertions are cryptographically signed. However, if the Service Provider's XML parser is flawed, an attacker can duplicate the assertion, alter the duplicated version (e.g., change `user@normal.com` to `admin@company.com`), and trick the parser into verifying the original signature but processing the malicious data.
- **Mitigation:** Use established, well-vetted SAML libraries that enforce strict schema validation and reject duplicate assertion tags.

### 🌐 OpenID Connect (OIDC) vs OAuth2
- **OAuth2** is for **Authorization** (giving a third-party app access to your data, like "Sign in with Google to read my contacts"). It issues an Access Token.
- **OIDC** sits on top of OAuth2 and adds **Authentication**. It issues an **ID Token** (usually a JWT) containing user identity information.

## 5. Vulnerability Triage & CVSS Scoring

Finding a bug is only step one. Communicating its risk is step two.

### 🧮 CVSS v3.1 (Common Vulnerability Scoring System)
A framework for rating the severity of vulnerabilities from 0.0 to 10.0.
1. **Attack Vector (AV):** Is it exploitable over the Network, Adjacent, Local, or Physical?
2. **Attack Complexity (AC):** Is it Low (easy to exploit) or High (requires race conditions or specific setups)?
3. **Privileges Required (PR):** None, Low, or High?
4. **User Interaction (UI):** None or Required (e.g., XSS requires a user to click).
5. **Scope (S):** Unchanged or Changed (e.g., escaping a sandbox)?
6. **CIA Impact:** Confidentiality, Integrity, Availability (None, Low, High).

*Example:* A Stored XSS that requires a victim to click a link (UI:R) and steals cookies (C:L, I:L, A:N) might score a 5.4 (Medium). An unauthenticated Remote Code Execution (AV:N, PR:N, C:H, I:H, A:H) is a 9.8-10.0 (Critical).

### 📝 Writing a Good Pentest Report
1. **Executive Summary:** For the CTO/Managers. Non-technical explanation of the business risk ("An attacker could steal all customer credit cards").
2. **Technical Details:** For the Developers. 
   - Vulnerability Name & Description.
   - Exact Steps to Reproduce (PoC).
   - HTTP Request/Response snippets.
   - Recommended Fix (Code level).
