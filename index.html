## 🎤 Interview Questions & Model Answers

<details>
<summary><strong>Q1: Why is passive subdomain enumeration conducted before active probing or brute-force scanning during offensive reconnaissance?</strong></summary>
<strong>Model Answer:</strong><br>
<strong>Passive reconnaissance</strong> extracts operational domain infrastructure details entirely from public third-party historical databases, Certificate Transparency log servers (like `crt.sh`), and external search indexers without ever transmitting direct networking packet traffic to the target's corporate IP ranges. Because no interaction occurs directly against the target organization's server infrastructure, passive enumeration leaves zero logging fingerprints on internal enterprise Intrusion Detection Systems (IDS), Web Application Firewalls (WAF), or SIEM monitoring pipelines. Performing exhaustive passive discovery first avoids triggering rate-limiting defensive bans or triggering SoC alerts prematurely, while providing a comprehensive structural map before executing targeted active engagement maneuvers.
</details>

<details>
<summary><strong>Q2: When chaining vulnerabilities, explain how an seemingly low-severity SSRF vulnerability can transform into an immediate High or Critical severity RCE or Cloud Account Compromise.</strong></summary>
<strong>Model Answer:</strong><br>
In modern containerized and cloud-native server environments (such as AWS, GCP, or Azure), virtual server instances implicitly trust network inquiries directed toward local **Cloud Instance Metadata Services (IMDS)** typically situated at the non-routable link-local IP address `169.254.169.254`. If an application suffers from even a seemingly minor blind or basic SSRF flaw that allows fetching internal HTTP endpoints, an attacker can manipulate the target URL parameter to request:
`http://169.254.169.254/latest/meta-data/iam/security-credentials/<IAM-Role-Name>/`. 
When the vulnerable application server fetches this URL and returns the output to the attacker, it discloses temporary **AWS Access Key IDs, Secret Access Keys, and Session Tokens** assigned directly to the running EC2 server role. If that IAM role possesses elevated infrastructure permission policies (e.g., S3 read/write or EC2 deployment capabilities), the offensive actor immediately pivots from a basic localized application defect to a comprehensive full cloud architecture compromise.
</details>

<details>
<summary><strong>Q3: Explain the mechanical differences between horizontal privilege escalation and vertical privilege escalation, providing a classic bug bounty example for each.</strong></summary>
<strong>Model Answer:</strong><br>
<strong>Horizontal Privilege Escalation</strong> occurs when an authenticated user gains unauthorized access to resources, files, or execution state owned by another peer user holding the exact same institutional role or security classification level. 
*Example:* A normal customer changing a parameter from `/view_profile?user_id=100` to `/view_profile?user_id=101`, thereby reading another customer's private data (classic IDOR/BOLA).

<strong>Vertical Privilege Escalation</strong> occurs when a standard low-privilege user abuses application flaws to elevate structural system authority, obtaining execution permissions typically reserved solely for higher-tiered roles such as Site Administrators or Superusers.
*Example:* An attacker signing up for a basic free demo account and abusing a **Mass Assignment / Parameter Binding flaw** during registration by appending `"is_admin": true` directly into the JSON POST payload, which an unprotected database model merges directly into user permissions, granting complete administrative control.
</details>

<details>
<summary><strong>Q4: Why do vulnerability triagers place heavy importance on distinguishing between theoretical vulnerability presence and documented functional "Impact"?</strong></summary>
<strong>Model Answer:</strong><br>
Security Engineering Teams and bug bounty triagers operate under severe vulnerability prioritization workflows; simply identifying an unusual behavioral aberration or a low-risk header misconfiguration (such as a missing framing security header or displaying verbose software build numbers) provides negligible actionable context regarding real enterprise danger. Triagers require documented **Functional Business Impact**, which clearly illustrates precisely what realistic catastrophe an attacker can achieve by executing the vulnerability under practical production conditions. Demonstrating impact transforms an academic debate into quantifiable corporate risk analysis (such as proving how an apparent innocent reflected XSS vuln chains into executing complete account takeover over financial support dashboards via cookie stealing or CSRF token capture).
</details>

<details>
<summary><strong>Q5: What is "Parameter Pollution" in web applications, and how can an AppSec tester leverage it to bypass authentication or defensive WAF filtering rules?</strong></summary>
<strong>Model Answer:</strong><br>
<strong>HTTP Parameter Pollution (HPP)</strong> arises when an attacker submits multiple instances of the exact same parameter key within a single HTTP request transmission (for example: `https://app.com/api?user=admin&user=test_user`). Different application web backend engines handle duplicated parameters in contradictory ways: some engines only process the first encountered occurrence (Java/JSP), some exclusively respect the final occurrence (PHP/Apache, Python/Flask), while others automatically combine values into a concatenated array or comma-delimited sequence (ASP.NET, Node.js/Express). 
An AppSec tester can weaponize this structural mismatch to bypass inline Web Application Firewalls (WAF): if an inline defensive firewall only checks the first incoming query token (`?user=safe_user`) for illegal payloads, but the terminal backend microservice parses exclusively the last token (`&user=admin' OR 1=1--`), the attacker effortlessly sneaks a critical injection payload straight through the perimeter defenses!
</details>

## 🎤 Interview Questions & Model Answers

<details>
<summary><strong>Q1: Why does replacing `127.0.0.1` with a decimal representation like `2130706433` successfully bypass basic WAF SSRF blacklist implementations while still connecting to local interfaces?</strong></summary>
<strong>Model Answer:</strong><br>
Standard Web Application Firewalls and custom regex validators often perform simplistic syntax pattern evaluations by string matching explicitly against `"127.0.0.1"` or `"localhost"`. However, when an underlying networking client or socket library (such as Linux `cURL`, Python's `urllib`, or Java's `InetAddress.getByName()`) executes systemic hostname resolution routines, it delegates IP expression evaluation directly to standard operating system networking system calls like `inet_aton()`. These low-level POSIX primitives natively recognize four discrete IPv4 notation syntaxes: standard dotted-decimal, octal array, hexadecimal string, and single 32-bit **Unsigned Decimal Integer representations**. Consequently, passing `http://2130706433/` glides cleanly around naive regex string blocking, after which the OS kernel silently translates the integer parameter straight into binary socket endpoint address `127.0.0.1`.
</details>

<details>
<summary><strong>Q2: During a SQL injection evaluation, what distinguishes a UNION-based injection exploit from a Boolean-blind injection exploit in terms of technical performance and efficiency?</strong></summary>
<strong>Model Answer:</strong><br>
In a **UNION-based injection exploit**, an attacker successfully piggybacks a second custom SELECT query syntax directly onto the legitimate output result array, enabling instant extraction of complete database tables, user listings, and password hashes displayed straight onto standard HTML application interface responses. This achieves extremely rapid, high-efficiency data exfiltration in mere dozens of request exchanges. 
Conversely, in a **Boolean-blind SQL injection**, application interfaces hide actual query results entirely, merely altering generic response characteristics (e.g., displaying a "Record found" page versus an "Item missing" page) depending upon whether an injected SQL logical assertion evaluates to True or False. To exfiltrate secure records under Boolean-blind constraints, an attacker must evaluate target data strictly character-by-character using ASCII byte bifurcation loops (`WHERE ascii(substring((SELECT password),1,1)) > 64`), requiring hundreds or thousands of high-latency automated individual HTTP query transmissions per extracted database credential!
</details>

<details>
<summary><strong>Q3: Explain how "Out-of-Band" (OOB) vulnerability exploitation operates, and identify why DNS interactions represent the most resilient interaction protocol when capturing OOB evidence.</strong></summary>
<strong>Model Answer:</strong><br>
<strong>Out-of-Band (OOB) exploitation</strong> relies on instructing an affected target infrastructure backend to instantiate an asynchronous network communication connection outward toward an external, monitoring server managed entirely by the attacker (such as PortSwigger Burp Collaborator or project Discovery interactsh). This technique proves invaluable whenever standard HTTP response pathways suppress error messages or mask command outputs completely (Blind RCE, Blind XXE, Blind SSRF).
Within OOB engagements, **DNS (Domain Name System) interactions** provide the highest transmission resilience because corporate enterprise firewalls, egress proxy restrictions, and WAF perimeter blocks aggressively restrict outbound direct HTTP, SSH, or TCP port connections initiated by application servers. Nevertheless, servers routinely remain allowed to query local network resolver infrastructures to translate target external DNS query syntax, which automatically forwards recursive query packet headers out toward public authoritative root nameservers—reliably delivering encoded target payload proofs directly to the attacker's DNS monitoring instrumentation regardless of internal firewall network segregation!
</details>

<details>
<summary><strong>Q4: Why does appending `%00` (Null Byte Termination) bypass legacy file extension validators during Local File Inclusion (LFI) or Arbitrary File Upload assessments?</strong></summary>
<strong>Model Answer:</strong><br>
In legacy runtime platforms (most famously PHP versions prior to v5.3.4, older Java virtual machines, and classic Perl CGI architectures), application logic routinely verifies user file strings using high-level string evaluation functions (like checking if a filename explicitly ends with `.jpg` or `.pdf` before permitting access). However, when the interpreted programming runtime ultimately hands off the validated string variable down to low-level C system runtime interfaces (such as POSIX filesystem primitives like `fopen` or `include`), standard C language conventions designate the hex byte token `0x00` (`%00` or `\0`) as the absolute structural **Null Character String Terminator**. 
When an attacker submits `../../../../etc/passwd%00.png`, higher-level evaluation routines validate the concluding `.png` extension and authorize the operation. But upon transmission into underlying kernel-level C file reading execution routines, processing immediately terminates reading upon encountering the `%00` byte, forcing the system runtime to load and output the target operating system parameter `/etc/passwd` directly!
</details>

# 🎤 13: Interview Preparation & Company Whiteboard Patterns

## 1. Indian AppSec Job Market

The AppSec market in India is booming, driven by compliance requirements and a surge in FinTech/SaaS startups.

| Company Type | Job Titles | Typical Salary (0-3 Yrs) | Focus Areas |
| :--- | :--- | :--- | :--- |
| **FinTech (Cred, Razorpay)** | AppSec Engineer, Product Security | ₹12L - ₹25L+ | Cloud Security, API Security, Automation |
| **MNCs (Microsoft, Amazon)** | Security Engineer, SWE - Security | ₹15L - ₹30L+ | Scale, deep technical fundamentals, coding |
| **Big 4 (EY, PwC, Deloitte)** | Cyber Security Consultant | ₹6L - ₹12L | Compliance, VAPT, client communication |
| **Pure Security (Payatu)** | Security Consultant, Pen Tester | ₹5L - ₹12L | Deep hacking skills, CVE hunting, zero-days |

## 2. Resume Building

* **Certifications:**
  * *Entry/Filter pass:* CEH, CompTIA Security+.
  * *High Value:* eWPT, eJPT, PortSwigger BSCP.
  * *Gold Standard:* OSCP.
* **Portfolio Building:** Maintain a GitHub repository with custom security scripts (e.g., a Python script automating recon), write-ups of CTFs, or published CVEs.

## 3. Company-Specific Interview Patterns

To read real interview experiences for these and other companies, search for "AppSec Interview Experience" on [Medium's InfoSec Write-ups](https://infosecwriteups.com/) or check company profiles on Glassdoor.

* **Product Companies (Flipkart, Razorpay, CRED, Paytm):**
  * *Focus:* Deep understanding of modern tech stacks (Node.js, Go, AWS). They care less about Nessus scans and more about securing CI/CD pipelines, DevSecOps, and API security (JWT, mass assignment).
  * *Rounds:* Often include a hands-on lab or take-home assignment to exploit/secure an app, followed by deep architecture discussions.
* **MNCs (Microsoft, Amazon, Google, Cisco):**
  * *Focus:* Deep computer science fundamentals (OS internals, networking), cryptography, and large-scale threat modeling.
  * *Rounds:* Almost always include a **Coding/DSA round** (LeetCode Easy/Medium) because they expect security engineers to read and write code fluently. For FAANG-level security prep, review the [Cybersecurity Interview Questions compiled by various communities on GitHub](https://github.com/topics/security-interview).
* **Big 4 (Deloitte, EY):**
  * *Focus:* Methodology, risk assessment, report writing, and compliance frameworks (ISO, PCI DSS).
  * *Rounds:* Scenario-based ("How would you pitch this critical vulnerability to a non-technical manager?").

## 4. HSBC Specific Questions (Deep Model Answers)

<details>
<summary><b>1. What is second order SQL injection and second order NoSQL injection?</b></summary>

**Model Answer:**
"First-order SQL injection occurs when malicious input is executed immediately in a query. Second-order SQL injection is a delayed attack. The application takes malicious input and securely stores it in the database (e.g., via a parameterized query during registration). The vulnerability triggers later when the application retrieves that stored, tainted data and uses it unsafely in a different query, such as string concatenation.
Second-order NoSQL injection follows the same concept but targets NoSQL databases like MongoDB. An attacker might input a malicious JSON payload or MongoDB operator like `$gt` (greater than) into a profile field. This is stored safely. Later, an admin views the profile, and the application uses that stored payload in a backend `db.collection.find()` operation without sanitization, leading to unauthorized data access."
</details>

<details>
<summary><b>2. Difference between SSRF and RFI?</b></summary>

**Model Answer:**
"Both involve making the server fetch resources, but their mechanics and impact differ.
**SSRF (Server-Side Request Forgery)** occurs when an attacker forces the server to make an HTTP request to an arbitrary domain of the attacker's choosing. The vulnerability is in the application's URL fetching logic. The main goal is often to access internal, non-routable networks (like localhost or cloud metadata services like `169.254.169.254`), bypassing firewalls.
**RFI (Remote File Inclusion)** is specific to languages like PHP. It occurs when user input is passed directly to an `include()` or `require()` function. The server fetches an external file (e.g., `http://attacker.com/malicious.php`) and, crucially, **executes** its contents within the server's environment. The main goal of RFI is direct Remote Code Execution (RCE)."
</details>

<details>
<summary><b>3. What is prototype pollution?</b></summary>

**Model Answer:**
"Prototype Pollution is a vulnerability specific to JavaScript. In JS, objects inherit properties from a prototype object. If an application uses an insecure merge or clone function, an attacker can inject properties into the base `Object.prototype`. They do this by sending a JSON payload containing the `__proto__` or `constructor.prototype` keys. Because every object in JavaScript inherits from `Object.prototype`, this injected property pollutes the global scope. This can lead to logic bypasses (e.g., injecting an `isAdmin: true` property that the application checks later), Denial of Service, or in some specific gadget chains, Remote Code Execution."
</details>

<details>
<summary><b>4. What is SSTI and CSTI?</b></summary>

**Model Answer:**
"Both are template injection vulnerabilities, but they execute in different environments.
**SSTI (Server-Side Template Injection)** occurs when user input is unsafely embedded into a template engine (like Jinja2, Twig, or FreeMarker) on the server. The template engine evaluates the input as code. Because this executes on the backend, SSTI often leads to severe impact, primarily Remote Code Execution (RCE) on the server.
**CSTI (Client-Side Template Injection)** occurs when modern frontend frameworks (like Vue.js or AngularJS) dynamically render user input as a template expression within the user's browser. While the syntax might look similar to SSTI, the code executes client-side. Therefore, the impact of CSTI is typically equivalent to Cross-Site Scripting (XSS), allowing the attacker to steal cookies or perform actions on behalf of the user."
</details>

<details>
<summary><b>5. Different types of attacks in JWT?</b></summary>

**Model Answer:**
"JSON Web Tokens (JWT) are common in modern APIs, and attacks usually target the verification process.
1. **'None' Algorithm Attack:** The attacker changes the `alg` header to `none` and removes the signature. If the backend library is misconfigured, it might accept the token without verifying it.
2. **Algorithm Confusion:** The backend expects RS256 (asymmetric, uses a public/private key), but the attacker changes the header to HS256 (symmetric) and signs the token using the server's public key (which they extracted). If the server uses that public key as an HMAC secret, it validates the forged token.
3. **Secret Brute Forcing:** If HS256 is used with a weak, predictable secret, an attacker can brute-force the secret offline and then forge tokens.
4. **Kid (Key ID) vulnerabilities:** The `kid` header tells the server which key to use for verification. Attackers might exploit this via SQL injection in the database lookup, or Directory Traversal to force the server to use a known file as the key."
</details>

<details>
<summary><b>6. What is JWK and JOSE in JWT? Have you heard about PS encryption in JWT?</b></summary>

**Model Answer:**
"**JOSE (JSON Object Signing and Encryption)** is the overarching framework that defines how to securely represent claims. JWT (JSON Web Token), JWS (Signature), and JWE (Encryption) are all built on the JOSE framework.
**JWK (JSON Web Key)** is a JSON data structure that represents a cryptographic key. It's often used at an endpoint (like `/.well-known/jwks.json`) to distribute public keys so consumers can verify the signatures of JWTs issued by an authorization server.
Regarding **PS encryption**, I believe you are referring to the **PS256/PS384/PS512** algorithms. These are not encryption, but rather signing algorithms. They stand for RSASSA-PSS (Probabilistic Signature Scheme). Compared to the older RS256 (PKCS#1 v1.5), PSS is a more modern, mathematically secure padding scheme for RSA signatures. It introduces randomness into the signature process, making it highly resistant to certain theoretical attacks that affect older RSA padding."
</details>

<details>
<summary><b>7. What is mass assignment?</b></summary>

**Model Answer:**
"Mass assignment occurs when modern web frameworks automatically bind HTTP request parameters (like JSON payloads or form data) directly to internal object models or database fields without proper whitelisting. For example, a user submits a registration form with `username` and `password`. The developer binds the entire incoming JSON object to the `User` model. If the attacker intercepts the request and adds `"role": "admin"` to the JSON payload, the framework might automatically update the database record to make the user an admin, bypassing intended business logic."
</details>

<details>
<summary><b>8. File upload vulnerabilities — test cases and exploit when .txt extension is appended.</b></summary>

**Model Answer:**
"When testing file uploads, my test cases include: checking for unrestricted file types, bypassing extension blacklists (e.g., using `.php5` or `.phtml`), testing for path traversal in the filename (`../../../shell.php`), uploading massive files for DoS, and checking if uploaded files overwrite existing system files.
If an application forcefully appends `.txt` to uploads (e.g., `shell.php` becomes `shell.php.txt`), exploiting it for RCE is harder but possible depending on the server configuration.
1. **Null Byte Injection:** In older systems, uploading `shell.php%00.jpg` might cause the system to drop the `.txt` and process it as PHP.
2. **Server Misconfiguration (Apache):** If Apache is configured to execute files based on multiple extensions (e.g., `AddHandler application/x-httpd-php .php`), a file named `shell.php.txt` might still be parsed as PHP if the server processes the first known extension it sees.
3. **If RCE fails:** I would pivot to Client-Side attacks. I can upload an HTML file containing XSS payload as `xss.html.txt`. When another user clicks the link to view the text file, the browser might sniff the MIME type as HTML and execute the JavaScript."
</details>

<details>
<summary><b>9. Which layer nmap works in?</b></summary>

**Model Answer:**
"Nmap operates across multiple layers of the OSI model depending on the scan type. The default TCP SYN scan (`-sS`), TCP Connect scan (`-sT`), and UDP scan (`-sU`) operate at the **Transport Layer (Layer 4)**. However, if you run OS detection (`-O`) or use NSE scripts that send malformed packets, it operates at the **Network Layer (Layer 3)**. Finally, when using service version detection (`-sV`) or application-specific NSE scripts (like HTTP enumeration), it interacts with the **Application Layer (Layer 7)**."
</details>

<details>
<summary><b>10. Which port ICMP uses?</b></summary>

**Model Answer:**
"This is a trick question. ICMP (Internet Control Message Protocol) **does not use ports**. Ports are a concept of the Transport Layer (Layer 4) used by protocols like TCP and UDP. ICMP is a Network Layer (Layer 3) protocol, operating alongside IP. Instead of ports, ICMP uses 'Types' and 'Codes' to identify messages. For example, an Echo Request (Ping) is Type 8, Code 0, and an Echo Reply is Type 0, Code 0."
</details>

<details>
<summary><b>11. Nmap is written in which language?</b></summary>

**Model Answer:**
"The core engine of Nmap, responsible for high-performance packet crafting and raw socket operations, is written in **C and C++**. However, the Nmap Scripting Engine (NSE), which powers advanced vulnerability detection and automation, uses scripts written in **Lua**."
</details>

<details>
<summary><b>12. In XSS if CSP is implemented how to bypass it?</b></summary>

**Model Answer:**
"Bypassing Content Security Policy (CSP) depends entirely on how poorly the policy is configured.
1. **`unsafe-inline` or `unsafe-eval`:** If the policy allows these, standard XSS payloads will work directly.
2. **Open Redirects/JSONP:** If the CSP whitelists a domain (e.g., `script-src 'self' api.google.com`), I would look for an open redirect or a JSONP endpoint on `api.google.com`. I can inject a script tag pointing to that trusted domain, but manipulate the JSONP callback to execute my payload, bypassing the policy.
3. **File Uploads:** If the site allows file uploads and whitelists its own domain (`'self'`), I can upload a malicious JS file and then reference it in my XSS payload (`&lt;script src="/uploads/my_malicious.js"&gt;&lt;/script&gt;`).
4. **Angular/Vue Misconfigurations:** If an older AngularJS library is whitelisted, I can exploit Client-Side Template Injection, which often bypasses standard CSP script restrictions."
</details>

<details>
<summary><b>13. Ways to mitigate CSRF attacks?</b></summary>

**Model Answer:**
"There are three primary ways to mitigate Cross-Site Request Forgery (CSRF).
1. **Anti-CSRF Tokens (Synchronizer Token Pattern):** The server generates a unique, cryptographically strong, and unpredictable token per session (or per request). This token is embedded in forms (as a hidden field) or sent via custom HTTP headers. The server rejects any state-changing request that doesn't include the valid token.
2. **SameSite Cookie Attribute:** Setting the session cookie with `SameSite=Lax` or `SameSite=Strict`. This instructs the browser not to send the session cookie in cross-site requests (like a POST request originating from an attacker's domain). This is the most modern and effective defense-in-depth measure.
3. **Double Submit Cookie:** The server sends a random value in a cookie and requires the client to send that exact same value in a request parameter. The server verifies they match. This works because an attacker cannot read or modify cookies due to the Same Origin Policy, so they cannot know the value to submit in the parameter."
</details>

## 7. Interview Day Tips

* **Use the STAR Method for Security:** When asked behavioral questions ("Tell me about a time you found a critical bug"), use Situation, Task, Action, Result. Emphasize the *business impact* (the Result).
* **Demonstrate Hands-on Knowledge:** Don't just say "I use Burp Suite." Say "I use Burp Intruder with custom payload lists for fuzzing, and I often write my own simple match-and-replace rules in the proxy."
* **Think Out Loud:** In scenario questions, the thought process is more important than the final answer. Walk them through your methodology.
* **Admit When You Don't Know:** Never guess. Say, "I haven't worked with that specific tool, but based on my knowledge of X, I assume it works similarly by doing Y. I would look up the documentation to confirm."

                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            },
            langPrefix: 'hljs language-'
        });

        const rawMarkdown = document.getElementById('raw-markdown').value;
        const htmlContent = marked.parse(rawMarkdown);
        const container = document.getElementById('content-container');
        container.innerHTML = htmlContent;

        // =================== EXTERNAL LINKS: OPEN IN NEW TAB ===================
        container.querySelectorAll('a').forEach(a => {
            const href = a.getAttribute('href');
            if (href && !href.startsWith('#')) {
                a.setAttribute('target', '_blank');
                a.setAttribute('rel', 'noopener noreferrer');
            }
        });

        // =================== ANCHOR CLICK HANDLING ===================
        container.addEventListener('click', function(e) {
            const link = e.target.closest('a');
            if (link && link.getAttribute('href') && link.getAttribute('href').startsWith('#')) {
                e.preventDefault();
                const targetId = link.getAttribute('href').substring(1);
                const targetElement = document.getElementById(targetId);
                if (targetElement) {
                    targetElement.scrollIntoView({ behavior: 'smooth' });
                }
            }
        });

        // =================== TABLE OF CONTENTS + PROGRESS ===================
        const toc = document.getElementById('toc');
        const headers = container.querySelectorAll('h1, h2, h3');
        const h2Headers = [];
        const savedProgress = JSON.parse(localStorage.getItem('appsec-progress') || '{}');
        
        headers.forEach((header, index) => {
            if (!header.id) { header.id = 'heading-' + index; }
            if (header.tagName === 'H1' && index === 0) return;
            
            const li = document.createElement('li');
            li.className = 'toc-' + header.tagName.toLowerCase();
            
            // Add checkbox for h2 headers
            if (header.tagName === 'H2') {
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.className = 'toc-checkbox';
                cb.checked = !!savedProgress[header.id];
                cb.addEventListener('change', function() {
                    const progress = JSON.parse(localStorage.getItem('appsec-progress') || '{}');
                    if (this.checked) { progress[header.id] = true; }
                    else { delete progress[header.id]; }
                    localStorage.setItem('appsec-progress', JSON.stringify(progress));
                    updateProgressBar();
                });
                li.appendChild(cb);
                h2Headers.push(header.id);
            }

            const a = document.createElement('a');
            a.href = '#' + header.id;
            a.textContent = header.textContent.replace(/[^\w\s\u200B-\u200D\uFEFF]/gi, '').trim() || header.textContent;

            a.addEventListener('click', function(e) {
                e.preventDefault();
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebar-overlay').classList.remove('active');
                document.getElementById(header.id).scrollIntoView({ behavior: 'smooth' });
            });

            li.appendChild(a);
            toc.appendChild(li);
        });

        function updateProgressBar() {
            const progress = JSON.parse(localStorage.getItem('appsec-progress') || '{}');
            const total = h2Headers.length;
            const done = h2Headers.filter(id => progress[id]).length;
            const pct = total > 0 ? (done / total) * 100 : 0;
            document.getElementById('progress-bar').style.width = pct + '%';
        }
        updateProgressBar();

        // =================== COLLAPSIBLE SECTIONS ===================
        const h2Elements = container.querySelectorAll('h2');
        h2Elements.forEach(h2 => {
            h2.classList.add('collapse-toggle');
            
            // Wrap content between this h2 and the next h2/h1/hr into a div
            const wrapper = document.createElement('div');
            wrapper.className = 'section-collapsible';
            let next = h2.nextElementSibling;
            const children = [];
            while (next && next.tagName !== 'H2' && next.tagName !== 'H1' && next.tagName !== 'HR') {
                children.push(next);
                next = next.nextElementSibling;
            }
            if (children.length > 0) {
                h2.after(wrapper);
                children.forEach(c => wrapper.appendChild(c));
            }

            h2.addEventListener('click', function() {
                const section = this.nextElementSibling;
                if (section && section.classList.contains('section-collapsible')) {
                    section.classList.toggle('collapsed');
                    this.classList.toggle('collapsed-heading');
                }
            });
        });

        let allCollapsed = false;
        function toggleCollapseAll() {
            allCollapsed = !allCollapsed;
            const btn = document.getElementById('collapse-btn');
            btn.textContent = allCollapsed ? '📂 Expand All' : '📂 Collapse All';
            document.querySelectorAll('.section-collapsible').forEach(s => {
                if (allCollapsed) { s.classList.add('collapsed'); }
                else { s.classList.remove('collapsed'); }
            });
            document.querySelectorAll('.collapse-toggle').forEach(h => {
                if (allCollapsed) { h.classList.add('collapsed-heading'); }
                else { h.classList.remove('collapsed-heading'); }
            });
        }

        // =================== QUIZ MODE ===================
        let quizMode = false;
        function toggleQuizMode() {
            quizMode = !quizMode;
            document.body.classList.toggle('quiz-mode', quizMode);
            const btn = document.getElementById('quiz-btn');
            btn.classList.toggle('active', quizMode);
            btn.textContent = quizMode ? '🧠 Quiz ON' : '🧠 Quiz';
            
            if (quizMode) {
                // Close all details so user can self-test
                document.querySelectorAll('details[open]').forEach(d => d.removeAttribute('open'));
                // Scroll to the first details element
                const firstQ = container.querySelector('details');
                if (firstQ) firstQ.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            // Count total questions
            const totalQ = container.querySelectorAll('details').length;
            if (quizMode && totalQ > 0) {
                btn.textContent = '🧠 Quiz ON (' + totalQ + ' Q)';
            }
        }

        // =================== SEARCH ===================
        let searchTimeout;
        function handleSearch(query) {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => performSearch(query), 250);
        }

        function performSearch(query) {
            // Remove old highlights
            container.querySelectorAll('mark.search-highlight').forEach(m => {
                const parent = m.parentNode;
                parent.replaceChild(document.createTextNode(m.textContent), m);
                parent.normalize();
            });
            
            const countEl = document.getElementById('search-count');
            if (!query || query.length < 2) { countEl.textContent = ''; return; }
            
            const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
            const matches = [];
            let node;
            
            while (node = walker.nextNode()) {
                if (node.parentElement.tagName === 'SCRIPT' || node.parentElement.tagName === 'STYLE') continue;
                if (node.parentElement.tagName === 'CODE' && node.parentElement.parentElement.tagName === 'PRE') continue;
                const idx = node.textContent.toLowerCase().indexOf(query.toLowerCase());
                if (idx !== -1) { matches.push({ node, idx }); }
            }
            
            countEl.textContent = matches.length > 0 ? matches.length + ' found' : 'No results';
            
            // Highlight matches (limit to 100 for performance)
            matches.slice(0, 100).reverse().forEach(({ node, idx }) => {
                const range = document.createRange();
                range.setStart(node, idx);
                range.setEnd(node, idx + query.length);
                const mark = document.createElement('mark');
                mark.className = 'search-highlight';
                range.surroundContents(mark);
            });
            
            // Scroll to first match
            const firstMark = container.querySelector('mark.search-highlight');
            if (firstMark) {
                firstMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // =================== DARK/LIGHT THEME ===================
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('appsec-theme', next);
            updateThemeBtn(next);
        }
        function updateThemeBtn(theme) {
            const btn = document.getElementById('theme-btn');
            if (btn) btn.textContent = theme === 'dark' ? '🌓 Light' : '🌓 Dark';
        }
        // Load saved theme
        const savedTheme = localStorage.getItem('appsec-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeBtn(savedTheme);

        // =================== BACK TO TOP ===================
        const backToTopBtn = document.getElementById('back-to-top');
        const mainWrapper = document.getElementById('main-wrapper');
        
        mainWrapper.addEventListener('scroll', function() {
            if (this.scrollTop > 300) { backToTopBtn.classList.add('visible'); }
            else { backToTopBtn.classList.remove('visible'); }
        });
        // Also handle body scroll on mobile
        window.addEventListener('scroll', function() {
            if (window.scrollY > 300) { backToTopBtn.classList.add('visible'); }
            else { backToTopBtn.classList.remove('visible'); }
        });
        
        function scrollToTop() {
            mainWrapper.scrollTo({ top: 0, behavior: 'smooth' });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // =================== MOBILE SIDEBAR ===================
        function toggleMobileSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('active');
        }

        // =================== KEYBOARD SHORTCUTS ===================
        document.addEventListener('keydown', function(e) {
            const isInput = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable;
            
            // Ctrl+K or / to open search
            if ((e.ctrlKey && e.key === 'k') || (!isInput && e.key === '/')) {
                e.preventDefault();
                const searchBox = document.getElementById('search-box');
                if (searchBox) {
                    searchBox.focus();
                    searchBox.select();
                }
            }
            // Esc to blur search box or close mobile sidebar
            if (e.key === 'Escape') {
                if (isInput) e.target.blur();
                const sidebar = document.getElementById('sidebar');
                if (sidebar && sidebar.classList.contains('open')) toggleMobileSidebar();
            }
            if (isInput) return; // ignore Q, T, C when typing in an input box
            
            // Q to toggle quiz mode
            if (e.key.toLowerCase() === 'q') {
                e.preventDefault();
                toggleQuizMode();
            }
            // T to toggle theme
            if (e.key.toLowerCase() === 't') {
                e.preventDefault();
                toggleTheme();
            }
            // C to toggle collapse all
            if (e.key.toLowerCase() === 'c') {
                e.preventDefault();
                toggleCollapseAll();
            }
        });

        // =================== TASK & LAB CHECKBOX PERSISTENCE ===================
        const savedLabProgress = JSON.parse(localStorage.getItem('appsec-labs-progress') || '{}');
        container.querySelectorAll('input[type="checkbox"]').forEach((chk, index) => {
            chk.removeAttribute('disabled');
            chk.style.cursor = 'pointer';
            chk.style.width = '16px';
            chk.style.height = '16px';
            chk.style.marginRight = '8px';
            const labId = 'lab-chk-' + index;
            if (savedLabProgress[labId]) {
                chk.checked = true;
            }
            chk.addEventListener('change', function() {
                savedLabProgress[labId] = chk.checked;
                localStorage.setItem('appsec-labs-progress', JSON.stringify(savedLabProgress));
            });
        });
    </script>
</body>
</html>
